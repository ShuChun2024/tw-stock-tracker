<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101827">
<title>觀測股票管理</title>
<style>
:root{color-scheme:dark;--bg:#101827;--panel:#1b2638;--border:#334155;--text:#e5edf7;--muted:#9aabc1;--blue:#60a5fa;--red:#f87171}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Microsoft JhengHei",sans-serif}
.container{max-width:850px;margin:auto;padding:18px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:23px;margin:8px 0}
h2{font-size:17px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;margin:16px 0}
input,button{width:100%;background:#263449;color:var(--text);border:1px solid var(--border);border-radius:8px;padding:11px;font-size:14px}
button{cursor:pointer}
button:hover{border-color:var(--blue)}
a{color:var(--blue);text-decoration:none}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{margin-bottom:12px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.actions button{width:auto;flex:1}
.primary{border-color:var(--blue)}
.danger{color:var(--red)}
.hint,#message{font-size:13px;line-height:1.6;color:var(--muted)}
#message{white-space:pre-wrap;margin-top:10px}
.stock-row{border-top:1px solid var(--border);padding:13px 0;display:flex;justify-content:space-between;align-items:center;gap:12px}
.stock-row:first-child{border-top:0}
.stock-name{font-weight:bold}
.stock-code{font-size:13px;color:var(--muted);margin-right:6px}
.company-name{font-size:12px;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}
.row-actions{display:flex;gap:6px;flex-shrink:0}
.row-actions button{width:auto;padding:8px 10px}
.empty{padding:15px;color:var(--muted)}
@media(max-width:520px){.container{padding:12px}.form-grid{grid-template-columns:1fr}.stock-row{align-items:flex-start}.row-actions{flex-direction:column}.row-actions button{width:76px}}
</style>
</head>
<body>
<div class="container">
<header>
  <h1>觀測股票管理</h1>
  <a href="./index.html">← 返回分析首頁</a>
</header>

<section class="panel">
  <h2 id="formTitle">新增觀測股票</h2>
  <form id="stockForm">
    <div class="form-grid">
      <div class="field">
        <label for="stockCode">股票代碼（4～6 位數字）</label>
        <input id="stockCode" inputmode="numeric" maxlength="6"
               pattern="[0-9]{4,6}" placeholder="例如：2330" required>
      </div>
      <div class="field">
        <label for="shortName">中文簡稱</label>
        <input id="shortName" maxlength="40" placeholder="例如：台積電">
      </div>
    </div>
    <div class="field">
      <label for="companyName">公司全名</label>
      <input id="companyName" maxlength="100" placeholder="例如：台灣積體電路製造股份有限公司">
    </div>
    <div class="actions">
      <button type="submit" class="primary" id="saveBtn">新增股票</button>
      <button type="button" id="lookupBtn">查詢公開名稱</button>
      <button type="button" id="cancelBtn" hidden>取消編輯</button>
    </div>
  </form>
  <div id="message" role="status">可輸入股票代碼後查詢名稱，也可以手動輸入。</div>
  <p class="hint">
    公開名稱查詢使用瀏覽器直接存取證交所／櫃買中心資料。若來源未開放 CORS、
    網路連線失敗或該代碼未出現在回傳資料中，請手動輸入名稱。
    名稱查詢成功也不代表後端已完成該股票的分析。
  </p>
</section>

<section class="panel">
  <h2>目前觀測清單（<span id="count">0</span> 檔）</h2>
  <div id="stockList"></div>
</section>
</div>

<script>
"use strict";

const WATCHLIST_KEY = "twStockWatchlistV1";
const DEFAULT_STOCKS = [
  {stock_id:"2330",short_name:"台積電",company_name:"台灣積體電路製造股份有限公司"},
  {stock_id:"2454",short_name:"聯發科",company_name:"聯發科技股份有限公司"},
  {stock_id:"2317",short_name:"鴻海",company_name:"鴻海精密工業股份有限公司"},
  {stock_id:"2603",short_name:"長榮",company_name:"長榮海運股份有限公司"}
];

let editingCode = null;
let watchlist = loadList();

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[ch]);
}

function loadList() {
  try {
    const saved = localStorage.getItem(WATCHLIST_KEY);
    if (saved === null) {
      localStorage.setItem(WATCHLIST_KEY, JSON.stringify(DEFAULT_STOCKS));
      return [...DEFAULT_STOCKS];
    }
    const list = JSON.parse(saved);
    return Array.isArray(list)
      ? list.filter(x => x && /^\d{4,6}$/.test(String(x.stock_id)))
      : [...DEFAULT_STOCKS];
  } catch (error) {
    return [...DEFAULT_STOCKS];
  }
}

function saveList() {
  localStorage.setItem(WATCHLIST_KEY, JSON.stringify(watchlist));
  renderList();
}

function showMessage(text) {
  document.getElementById("message").textContent = text;
}

function resetForm() {
  editingCode = null;
  document.getElementById("stockForm").reset();
  document.getElementById("formTitle").textContent = "新增觀測股票";
  document.getElementById("saveBtn").textContent = "新增股票";
  document.getElementById("stockCode").disabled = false;
  document.getElementById("cancelBtn").hidden = true;
}

function renderList() {
  document.getElementById("count").textContent = watchlist.length;
  const root = document.getElementById("stockList");

  if (!watchlist.length) {
    root.innerHTML = '<div class="empty">目前沒有觀測股票，請在上方新增。</div>';
    return;
  }

  root.innerHTML = watchlist.map(item => `
    <div class="stock-row">
      <div>
        <div>
          <span class="stock-code">${escapeHTML(item.stock_id)}</span>
          <span class="stock-name">${escapeHTML(item.short_name || "名稱待確認")}</span>
        </div>
        <div class="company-name">${escapeHTML(item.company_name || "公司全名待確認")}</div>
      </div>
      <div class="row-actions">
        <button type="button" data-edit="${escapeHTML(item.stock_id)}">編輯</button>
        <button type="button" class="danger" data-delete="${escapeHTML(item.stock_id)}">刪除</button>
      </div>
    </div>
  `).join("");

  root.querySelectorAll("[data-edit]").forEach(button => {
    button.addEventListener("click", () => editStock(button.dataset.edit));
  });

  root.querySelectorAll("[data-delete]").forEach(button => {
    button.addEventListener("click", () => deleteStock(button.dataset.delete));
  });
}

function editStock(code) {
  const item = watchlist.find(x => String(x.stock_id) === String(code));
  if (!item) return;

  editingCode = String(code);
  document.getElementById("stockCode").value = item.stock_id;
  document.getElementById("stockCode").disabled = true;
  document.getElementById("shortName").value = item.short_name || "";
  document.getElementById("companyName").value = item.company_name || "";
  document.getElementById("formTitle").textContent = "編輯股票名稱";
  document.getElementById("saveBtn").textContent = "儲存修改";
  document.getElementById("cancelBtn").hidden = false;
  showMessage("正在編輯 " + code + "；儲存後會更新首頁使用的觀測清單。");
  window.scrollTo({top:0,behavior:"smooth"});
}

function deleteStock(code) {
  const item = watchlist.find(x => String(x.stock_id) === String(code));
  if (!item) return;

  if (!confirm("確定要從觀測清單刪除 " + code + " " + (item.short_name || "") + "？")) return;
  watchlist = watchlist.filter(x => String(x.stock_id) !== String(code));
  saveList();
  if (editingCode === String(code)) resetForm();
  showMessage("已刪除 " + code + "。此操作只會更新本機觀測清單，不會刪除後端分析資料。");
}

document.getElementById("stockForm").addEventListener("submit", event => {
  event.preventDefault();

  const code = document.getElementById("stockCode").value.trim();
  const shortName = document.getElementById("shortName").value.trim();
  const companyName = document.getElementById("companyName").value.trim();

  if (!/^\d{4,6}$/.test(code)) {
    showMessage("股票代碼格式錯誤，請輸入 4～6 位數字。");
    return;
  }

  if (!shortName && !companyName) {
    showMessage("請至少填寫中文簡稱或公司全名；也可以先按「查詢公開名稱」。");
    return;
  }

  if (editingCode === null && watchlist.some(x => String(x.stock_id) === code)) {
    showMessage("此股票代碼已存在於觀測清單，請勿重複新增。");
    return;
  }

  if (editingCode !== null) {
    watchlist = watchlist.map(x => String(x.stock_id) === editingCode
      ? {...x, short_name:shortName || x.short_name || "名稱待確認",
         company_name:companyName || x.company_name || ""}
      : x);
    showMessage("股票名稱已更新。");
  } else {
    watchlist.push({
      stock_id:code,
      short_name:shortName || companyName,
      company_name:companyName || shortName
    });
    showMessage("已新增 " + code + "。若 analysis.json 尚無此股票，首頁會顯示「尚未分析」。");
  }

  saveList();
  resetForm();
});

document.getElementById("cancelBtn").addEventListener("click", resetForm);

async function fetchWithTimeout(url, timeoutMs=7000) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  try {
    const response = await fetch(url, {
      signal:controller.signal,
      cache:"no-store"
    });
    if (!response.ok) throw new Error("HTTP " + response.status);
    return await response.json();
  } finally {
    clearTimeout(timer);
  }
}

function findNameInRows(rows, code) {
  if (!Array.isArray(rows)) return null;

  for (const row of rows) {
    const codeValue = String(
      row["公司代號"] ?? row["有價證券代號"] ??
      row["Code"] ?? row["SecuritiesCompanyCode"] ??
      row["證券代號"] ?? row["股票代號"] ?? ""
    ).trim();

    if (codeValue !== code) continue;

    const shortName = String(
      row["公司簡稱"] ?? row["Name"] ??
      row["證券名稱"] ?? row["有價證券名稱"] ??
      row["CompanyShortName"] ?? ""
    ).trim();

    const companyName = String(
      row["公司名稱"] ?? row["CompanyName"] ??
      row["公司全名"] ?? row["CompanyFullName"] ?? ""
    ).trim();

    if (shortName || companyName) {
      return {
        short_name:shortName || companyName,
        company_name:companyName || shortName
      };
    }
  }
  return null;
}

async function lookupStockName() {
  const code = document.getElementById("stockCode").value.trim();
  if (!/^\d{4,6}$/.test(code)) {
    showMessage("請先輸入正確格式的股票代碼。");
    return;
  }

  const button = document.getElementById("lookupBtn");
  button.disabled = true;
  button.textContent = "查詢中…";
  showMessage("正在嘗試查詢公開資料；若來源未開放 CORS，瀏覽器可能會拒絕連線。");

  try {
    let found = null;
    const sources = [
      "https://openapi.twse.com.tw/v1/opendata/t187ap03_L",
      "https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL",
      "https://www.tpex.org.tw/openapi/v1/tpex_mainboard_daily_close_quotes"
    ];

    for (const url of sources) {
      try {
        const data = await fetchWithTimeout(url);
        const rows = Array.isArray(data) ? data : (data.data || data.result || []);
        found = findNameInRows(rows, code);
        if (found) break;
      } catch (error) {
        // 逐一嘗試其他公開來源；CORS 或網路失敗不會中止整個管理頁。
      }
    }

    if (!found) {
      showMessage("未能自動取得此代碼的名稱。可能是 CORS 限制、公開資料格式不同，或該代碼不在目前資料集。請手動填寫中文簡稱及公司全名。");
      return;
    }

    document.getElementById("shortName").value = found.short_name;
    document.getElementById("companyName").value = found.company_name;
    showMessage("已取得公開資料名稱。請核對後按「新增股票」或「儲存修改」。");
  } catch (error) {
    showMessage("名稱查詢失敗，請手動輸入名稱。錯誤：" + error.message);
  } finally {
    button.disabled = false;
    button.textContent = "查詢公開名稱";
  }
}

document.getElementById("lookupBtn").addEventListener("click", lookupStockName);

window.addEventListener("storage", event => {
  if (event.key === WATCHLIST_KEY) {
    watchlist = loadList();
    renderList();
  }
});

renderList();
</script>
</body>
</html>
