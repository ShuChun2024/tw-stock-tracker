<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101827">
<title>台股分析儀表板</title>

<style>
:root {
  color-scheme: dark;
  --bg: #101827;
  --panel: #1b2638;
  --border: #334155;
  --text: #e5edf7;
  --muted: #9aabc1;
  --red: #ff7272;
  --green: #4ade80;
  --blue: #60a5fa;
  --yellow: #fbbf24;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Microsoft JhengHei",
    sans-serif;
}

button,
input,
select {
  font: inherit;
}

button,
select {
  cursor: pointer;
}

header {
  padding: 18px 20px;
  border-bottom: 1px solid var(--border);
  background: #111c2d;
  position: sticky;
  top: 0;
  z-index: 20;
}

.header-inner {
  max-width: 1400px;
  margin: auto;
}

.header-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}

h1 {
  margin: 0;
  font-size: 24px;
}

.update-time {
  color: var(--muted);
  font-size: 13px;
  margin-top: 6px;
}

.header-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

button,
.action-link {
  border: 1px solid var(--border);
  background: #223047;
  color: var(--text);
  border-radius: 8px;
  padding: 8px 12px;
  text-decoration: none;
}

button:hover,
.action-link:hover {
  background: #2b3c56;
}

.toolbar {
  max-width: 1400px;
  margin: 16px auto 0;
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}

.search-box {
  flex: 1;
  min-width: 220px;
}

.search-box input {
  width: 100%;
  background: #111c2d;
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  outline: none;
}

.search-box input:focus {
  border-color: var(--blue);
}

.sort-box select {
  background: #111c2d;
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
}

#message {
  max-width: 1400px;
  margin: 14px auto;
  color: var(--muted);
  font-size: 14px;
}

.stock-grid {
  max-width: 1400px;
  margin: 0 auto;
  padding: 10px 20px 30px;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
  gap: 16px;
}

.stock-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  overflow: hidden;
}

.stock-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
}

.stock-id {
  font-size: 21px;
  font-weight: 700;
}

.company-short {
  margin-top: 3px;
  font-size: 16px;
  font-weight: 600;
}

.company-full {
  margin-top: 3px;
  color: var(--muted);
  font-size: 12px;
}

.status {
  font-size: 12px;
  padding: 4px 7px;
  border-radius: 5px;
  background: #26364c;
  color: var(--muted);
  white-space: nowrap;
}

.status.good {
  color: var(--green);
}

.status.warn {
  color: var(--yellow);
}

.score-area {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 16px 0;
  padding: 12px;
  border-radius: 10px;
  background: #111c2d;
}

.score {
  font-size: 38px;
  line-height: 1;
  font-weight: 800;
}

.score-label {
  color: var(--muted);
  font-size: 12px;
  margin-top: 5px;
}

.score-status {
  text-align: right;
  font-weight: 600;
}

.metrics {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 14px;
}

.metric {
  padding: 9px;
  border: 1px solid var(--border);
  border-radius: 8px;
  min-width: 0;
}

.metric-label {
  color: var(--muted);
  font-size: 11px;
  margin-bottom: 5px;
}

.metric-value {
  font-size: 15px;
  font-weight: 600;
  word-break: break-word;
}

.indicator-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  margin-bottom: 14px;
}

.indicator {
  padding: 9px;
  border: 1px solid var(--border);
  border-radius: 8px;
}

.indicator-label {
  color: var(--muted);
  font-size: 11px;
}

.indicator-value {
  margin-top: 4px;
  font-size: 14px;
  font-weight: 600;
}

.score-breakdown {
  margin-top: 12px;
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
}

.score-breakdown-title {
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 10px;
}

.score-row {
  margin-bottom: 9px;
}

.score-row:last-child {
  margin-bottom: 0;
}

.score-row-head {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  font-size: 12px;
  margin-bottom: 4px;
}

.score-track {
  height: 6px;
  background: #111827;
  border-radius: 99px;
  overflow: hidden;
}

.score-fill {
  height: 100%;
  border-radius: 99px;
}

.details {
  margin-top: 12px;
}

.details summary {
  cursor: pointer;
  color: var(--blue);
  font-size: 13px;
  user-select: none;
}

.details-content {
  margin-top: 10px;
  font-size: 12px;
}

.detail-section {
  border-top: 1px solid var(--border);
  padding: 12px 0;
}

.detail-section:first-child {
  border-top: 0;
  padding-top: 0;
}

.detail-title {
  font-size: 13px;
  font-weight: 700;
  margin-bottom: 8px;
}

.detail-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px 12px;
}

.detail-item {
  min-width: 0;
}

.detail-label {
  color: var(--muted);
}

.detail-value {
  margin-top: 2px;
  word-break: break-word;
}

.technical-summary,
.institutional-summary {
  margin-top: 10px;
  padding: 10px;
  border-radius: 7px;
  background: #111c2d;
  line-height: 1.6;
}

.technical-details,
.institutional-details {
  margin-top: 10px;
}

.institutional-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 11px;
}

.institutional-table th,
.institutional-table td {
  border-bottom: 1px solid var(--border);
  padding: 6px 4px;
  text-align: right;
}

.institutional-table th:first-child,
.institutional-table td:first-child {
  text-align: left;
}

.quality {
  margin-top: 10px;
  padding: 9px;
  border-radius: 7px;
  background: #111c2d;
  line-height: 1.6;
}

.quality.good {
  border-left: 3px solid var(--green);
}

.quality.warn {
  border-left: 3px solid var(--yellow);
}

.empty {
  grid-column: 1 / -1;
  text-align: center;
  padding: 50px 20px;
  color: var(--muted);
}

.loading {
  opacity: 0.65;
  pointer-events: none;
}

footer {
  max-width: 1400px;
  margin: 0 auto;
  padding: 10px 20px 35px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.7;
}

.small-note {
  color: var(--muted);
  font-size: 11px;
  margin-top: 7px;
}

@media (max-width: 700px) {
  header {
    padding: 14px;
  }

  h1 {
    font-size: 20px;
  }

  .stock-grid {
    grid-template-columns: 1fr;
    padding: 8px 12px 25px;
  }

  .toolbar {
    margin: 12px 14px 0;
  }

  .metrics {
    grid-template-columns: 1fr;
  }

  .indicator-grid {
    grid-template-columns: 1fr;
  }

  .score {
    font-size: 32px;
  }

  .detail-grid {
    grid-template-columns: 1fr;
  }
}
.trend-up {
  color: var(--red);
}

.trend-down {
  color: var(--green);
}
  
</style>
</head>

<body>

<header>
  <div class="header-inner">

    <div class="header-title">
      <div>
        <h1>台股分析儀表板</h1>
        <div class="update-time" id="updateTime">
          資料載入中…
        </div>
      </div>

      <div class="header-actions">
        <button id="refreshBtn" type="button">
          ↻ 重新整理
        </button>

        <a
          class="action-link"
          href="./watchlist.html"
        >
          管理觀測股票
        </a>
      </div>
    </div>

    <div class="toolbar">

      <div class="search-box">
        <input
          id="searchInput"
          type="search"
          placeholder="搜尋代碼、股票名稱…"
          autocomplete="off"
        >
      </div>

      <div class="sort-box">
        <select id="sortSelect">
          <option value="code">股票代碼</option>
          <option value="name">中文名稱</option>
          <option value="scoreDesc">評分高至低</option>
          <option value="scoreAsc">評分低至高</option>
        </select>
      </div>

    </div>

  </div>
</header>

<div id="message">
  資料載入中…
</div>

<main>
  <div id="stockGrid" class="stock-grid"></div>
</main>

<footer>
  <div>
    本頁顯示 analysis.json 已產生的全部分析結果。
  </div>

  <div>
    新增觀測股票不代表該股票已完成分析。
  </div>

  <div>
    尚無分析結果的股票不會自動出現在本頁。
  </div>

  <div>
    評分僅供資料分析與觀察使用，非投資建議。
  </div>
</footer>

<script>
"use strict";

/* ============================================================
   1. 基本設定
   ============================================================ */

const WATCHLIST_KEY = "twStockWatchlist";
const OLD_WATCHLIST_KEY = "twStockWatchlistV1";

const DEFAULT_STOCKS = [
  { code: "1101", name: "台泥" },
  { code: "1102", name: "亞泥" },
  { code: "2034", name: "允強" },
  { code: "2330", name: "台積電" },
  { code: "2377", name: "微星" },
  { code: "2603", name: "長榮" },
  { code: "2834", name: "臺企銀" },
  { code: "2882", name: "國泰金" },
  { code: "2883", name: "開發金" },
  { code: "6117", name: "迎廣" },
  { code: "6750", name: "泰創" }
];

let analysisMap = new Map();
let stockDatabase = new Map();

let analysisUpdateTime = "";
let analysisMeta = {};
let loading = false;


/* ============================================================
   2. 通用工具
   ============================================================ */

function escapeHTML(value) {
  if (value === null || value === undefined) {
    return "";
  }

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function normalizeCode(value) {
  if (value === null || value === undefined) {
    return "";
  }

  return String(value)
    .trim()
    .replace(/^['"]|['"]$/g, "");
}


function validNumber(value) {
  if (
    value === null ||
    value === undefined ||
    value === "" ||
    Number.isNaN(Number(value))
  ) {
    return null;
  }

  return Number(value);
}


function fmt(value, digits = 2) {
  const number = validNumber(value);

  if (number === null) {
    return "—";
  }

  return number.toLocaleString("zh-TW", {
    minimumFractionDigits: digits,
    maximumFractionDigits: digits
  });
}


function signedPercent(value, digits = 2) {
  const number = validNumber(value);

  if (number === null) {
    return "—";
  }

  const prefix = number > 0 ? "+" : "";

  return prefix + fmt(number, digits) + "%";
}


function fmtVolume(value) {
  const number = validNumber(value);

  if (number === null) {
    return "—";
  }

  if (Math.abs(number) >= 100000000) {
    return fmt(number / 100000000, 2) + " 億";
  }

  if (Math.abs(number) >= 10000) {
    return fmt(number / 10000, 2) + " 萬";
  }

  return fmt(number, 0);
}


function scoreText(value, max = 100) {
  const number = validNumber(value);

  if (number === null) {
    return "—";
  }

  return fmt(number, 1) + " / " + max;
}


function scoreStatus(score) {
  const number = validNumber(score);

  if (number === null) {
    return "無評分";
  }

  if (number >= 80) {
    return "強勢";
  }

  if (number >= 70) {
    return "偏強";
  }

  if (number >= 60) {
    return "中上";
  }

  if (number >= 50) {
    return "中性";
  }

  if (number >= 40) {
    return "偏弱";
  }

  return "弱勢";
}


/* ============================================================
   3. 分數顏色
   ============================================================ */

function scoreColor(score) {
  const number = validNumber(score);

  if (number === null) {
    return "var(--muted)";
  }

  if (number >= 70) {
    return "var(--green)";
  }

  if (number >= 50) {
    return "var(--yellow)";
  }

  return "var(--red)";
}


/* ============================================================
   4. 趨勢顏色
   ============================================================ */

function trendClass(value) {
  if (value === null || value === undefined) {
    return "";
  }

  const text = String(value).trim();

  if (
    text.includes("上升") ||
    text.includes("增加") ||
    text.includes("成長") ||
    text.includes("正向") ||
    text.includes("偏多") ||
    text.includes("多方")
  ) {
    return "trend-up";
  }

  if (
    text.includes("下降") ||
    text.includes("減少") ||
    text.includes("衰退") ||
    text.includes("負向") ||
    text.includes("偏空") ||
    text.includes("空方")
  ) {
    return "trend-down";
  }

  return "";
}


/* ============================================================
   5. 缺少資料名稱轉換
   ============================================================ */

function normalizeMissingItems(items) {
  if (!Array.isArray(items)) {
    return [];
  }

  const map = {
    revenue: "營收",
    revenue_data: "營收",
    foreign_holding: "外資持股",
    foreign: "外資持股",
    institutional: "三大法人買賣超",
    technical: "技術面",
    technical_data: "技術面"
  };

  return items.map(item => {
    const key = String(item).trim();

    return map[key] || key;
  });
}


/* ============================================================
   6. 通用指標盒
   ============================================================ */

function metricBox(label, value, extraClass = "") {
  return `
    <div class="metric ${extraClass}">
      <div class="metric-label">
        ${escapeHTML(label)}
      </div>

      <div class="metric-value">
        ${value}
      </div>
    </div>
  `;
}


/* ============================================================
   7. 讀取 localStorage 觀測清單
   ============================================================ */

function getWatchlistNames() {
  const result = new Map();

  const keys = [
    WATCHLIST_KEY,
    OLD_WATCHLIST_KEY
  ];

  for (const key of keys) {
    try {
      const raw = localStorage.getItem(key);

      if (!raw) {
        continue;
      }

      const data = JSON.parse(raw);

      if (Array.isArray(data)) {
        for (const item of data) {

          if (typeof item === "string") {
            const code = normalizeCode(item);

            if (code) {
              result.set(code, "");
            }

            continue;
          }

          if (!item || typeof item !== "object") {
            continue;
          }

          const code = normalizeCode(
            item.code ??
            item.stock_id ??
            item.stockId ??
            item.id
          );

          if (!code) {
            continue;
          }

          const name =
            item.name ??
            item.stock_name ??
            item.stockName ??
            item.company_name ??
            "";

          result.set(code, String(name).trim());
        }
      }

      else if (
        data &&
        typeof data === "object"
      ) {
        for (const [codeKey, value] of Object.entries(data)) {

          const code = normalizeCode(codeKey);

          if (!code) {
            continue;
          }

          let name = "";

          if (typeof value === "string") {
            name = value.trim();
          }

          else if (
            value &&
            typeof value === "object"
          ) {
            name =
              value.name ??
              value.stock_name ??
              value.stockName ??
              "";
          }

          result.set(code, String(name).trim());
        }
      }

    } catch (error) {
      console.warn(
        "讀取觀測清單失敗：",
        key,
        error
      );
    }
  }

  return result;
}


/* ============================================================
   8. stocks.json 資料庫
   ============================================================ */

function addDatabaseEntry(code, name, fullName = "") {
  code = normalizeCode(code);

  if (!code) {
    return;
  }

  const old = stockDatabase.get(code) || {};

  stockDatabase.set(code, {
    code,
    name:
      String(name || old.name || "").trim(),

    fullName:
      String(fullName || old.fullName || "").trim()
  });
}


function parseStockDatabase(data) {

  if (Array.isArray(data)) {

    for (const item of data) {

      if (!item || typeof item !== "object") {
        continue;
      }

      const code = normalizeCode(
        item.code ??
        item.stock_id ??
        item.stockId ??
        item.id
      );

      const name =
        item.name ??
        item.stock_name ??
        item.stockName ??
        item.company_name ??
        "";

      const fullName =
        item.full_name ??
        item.fullName ??
        item.company_full_name ??
        "";

      if (code) {
        addDatabaseEntry(
          code,
          name,
          fullName
        );
      }
    }

    return;
  }


  if (
    data &&
    typeof data === "object"
  ) {

    if (Array.isArray(data.stocks)) {
      parseStockDatabase(data.stocks);
      return;
    }

    for (const [codeKey, value] of Object.entries(data)) {

      const code = normalizeCode(codeKey);

      if (!code) {
        continue;
      }

      let name = "";
      let fullName = "";

      if (typeof value === "string") {
        name = value;
      }

      else if (
        value &&
        typeof value === "object"
      ) {
        name =
          value.name ??
          value.stock_name ??
          value.stockName ??
          value.company_name ??
          "";

        fullName =
          value.full_name ??
          value.fullName ??
          value.company_full_name ??
          "";
      }

      addDatabaseEntry(
        code,
        name,
        fullName
      );
    }
  }
}


async function loadStockDatabase() {

  try {

    const response = await fetch(
      "./stocks.json?t=" + Date.now(),
      {
        cache: "no-store"
      }
    );

    if (!response.ok) {
      throw new Error(
        "stocks.json HTTP " + response.status
      );
    }

    const data = await response.json();

    stockDatabase.clear();

    parseStockDatabase(data);

    console.log(
      "stocks.json 載入完成，共",
      stockDatabase.size,
      "筆"
    );

  } catch (error) {

    console.warn(
      "stocks.json 載入失敗：",
      error
    );

    stockDatabase.clear();

    for (const item of DEFAULT_STOCKS) {
      addDatabaseEntry(
        item.code,
        item.name,
        item.name
      );
    }
  }
}


/* ============================================================
   9. 股票名稱對應
   ============================================================ */

function getStockDisplayInfo(result) {

  const code = normalizeCode(
    result?.stock_id ??
    result?.stockId ??
    result?.code
  );

  const watchlist = getWatchlistNames();

  const localName =
    watchlist.get(code) || "";

  const database =
    stockDatabase.get(code) || {};

  const defaultItem =
    DEFAULT_STOCKS.find(
      item => item.code === code
    );

  const analysisName =
    result?.stock_name ??
    result?.stockName ??
    result?.name ??
    result?.company_name ??
    "";

  const name =
    localName ||
    database.name ||
    defaultItem?.name ||
    analysisName ||
    "名稱待確認";

  const fullName =
    database.fullName ||
    result?.company_full_name ||
    result?.full_name ||
    "";

  return {
    code,
    name,
    fullName
  };
}


/* ============================================================
   10. 取得正確的三大評分
   ============================================================ */

function getScoreBreakdown(stock) {

  const breakdown =
    stock?.score_breakdown || {};

  const revenueScore =
    validNumber(
      stock?.revenue?.score
    );

  const foreignScore =
    validNumber(
      stock?.foreign_holding?.score
    );

  const technicalScore =
    validNumber(
      stock?.technical?.score
    );

  /*
    analysis.json 的正式評分結構：

    fundamental = 基本面 / 40
    chip        = 籌碼面 / 20
    technical   = 技術面 / 40

    特別注意：
    foreign_holding.score 是「外資持股」自己的分數，
    不等於完整的「籌碼面」分數。

    因此只要 analysis.json 有
    score_breakdown.chip，
    優先使用 chip。
  */

  const fundamental =
    validNumber(
      breakdown.fundamental
    ) ??
    revenueScore;

  const chip =
    validNumber(
      breakdown.chip
    ) ??
    foreignScore;

  const technical =
    validNumber(
      breakdown.technical
    ) ??
    technicalScore;

  return {
    fundamental,
    chip,
    technical
  };
}


/* ============================================================
   11. 綜合評分組成
   ============================================================ */

function renderScoreBreakdown(stock) {

  const breakdown =
    getScoreBreakdown(stock);

  const rows = [
    {
      label: "基本面",
      score: breakdown.fundamental,
      max: 40
    },
    {
      label: "籌碼面",
      score: breakdown.chip,
      max: 20
    },
    {
      label: "技術面",
      score: breakdown.technical,
      max: 40
    }
  ];

  const html = rows.map(row => {

    const score =
      validNumber(row.score);

    const percent =
      score === null
        ? 0
        : Math.max(
            0,
            Math.min(
              100,
              (score / row.max) * 100
            )
          );

    return `
      <div class="score-row">

        <div class="score-row-head">
          <span>

        <div class="score-track">
          <div
            class="score-fill"
            style="
              width:${percent}%;
              background:${scoreColor(
                row.max === 100
                  ? score
                  : (score / row.max) * 100
              )};
            "
          ></div>
        </div>

      </div>
    `;
  }).join("");

  const total =
    validNumber(stock?.total_score) ??
    validNumber(stock?.score) ??
    validNumber(stock?.total);

  return `

}

function getInstitutionalData(stock) {

  const data = stock?.institutional;

  if (!data || typeof data !== "object") {
    return {
      available: false,
      latest: null,
      records: []
    };
  }

  let records = [];

  /*
    支援常見資料格式：

    institutional.records
    institutional.data
    institutional.items
    institutional.history
  */

  const rawRecords =
    Array.isArray(data.records)
      ? data.records
      : Array.isArray(data.data)
        ? data.data
        : Array.isArray(data.items)
          ? data.items
          : Array.isArray(data.history)
            ? data.history
            : [];

  records = rawRecords
    .filter(item => item && typeof item === "object")
    .map(item => {

      const date =
        item.date ??
        item.trade_date ??
        item.trading_date ??
        item.datetime ??
        "";

      const foreign =
        item.foreign ??
        item.foreign_investor ??
        item.foreign_net ??
        item.foreign_net_buy_sell ??
        item.foreign_buy_sell ??
        0;

      const investmentTrust =
        item.investment_trust ??
        item.investmentTrust ??
        item.trust ??
        item.investment_trust_net ??
        0;

      const dealer =
        item.dealer ??
        item.dealer_net ??
        item.dealer_buy_sell ??
        0;

      const total =
        item.total ??
        item.total_net ??
        item.total_buy_sell ??
        (
          validNumber(foreign) !== null &&
          validNumber(investmentTrust) !== null &&
          validNumber(dealer) !== null
            ? Number(foreign) +
              Number(investmentTrust) +
              Number(dealer)
            : null
        );

      return {
        date,
        foreign: validNumber(foreign),
        investmentTrust: validNumber(investmentTrust),
        dealer: validNumber(dealer),
        total: validNumber(total)
      };
    });

  const latest =
    data.latest &&
    typeof data.latest === "object"
      ? {
          date:
            data.latest.date ??
            data.latest.trade_date ??
            "",
          foreign:
            validNumber(
              data.latest.foreign ??
              data.latest.foreign_net
            ),
          investmentTrust:
            validNumber(
              data.latest.investment_trust ??
              data.latest.investmentTrust ??
              data.latest.trust
            ),
          dealer:
            validNumber(
              data.latest.dealer ??
              data.latest.dealer_net
            ),
          total:
            validNumber(
              data.latest.total ??
              data.latest.total_net
            )
        }
      : (
          records.length > 0
            ? records[0]
            : null
        );

  return {
    available:
      latest !== null ||
      records.length > 0,

    latest,
    records
  };
}

          </div>

          <div class="detail-item">
            <div class="detail-label">
              外資分數
            </div>

            <div class="detail-value">

                  foreignDescription
                )}
              </div>
            `
            : ""
        }

      </div>


      <!-- ==================================================
           技術分析
           ================================================== -->

      <div class="detail-section">

        <div class="detail-title">

            </div>

              技術趨勢
            </div>

                technical.trend ??

                "—"
              )}

           資料完整性

}
/* ============================================================
   23. 取得股票總分
   ============================================================ */

function getTotalScore(stock) {
  return (
    validNumber(stock?.total_score) ??
    validNumber(stock?.score) ??
    validNumber(stock?.total)
  );
}


/* ============================================================
   24. 股票狀態
   ============================================================ */

function getStockStatus(stock) {
  const quality = getDataQuality(stock);

  if (!quality.complete) {
    return {
      text: "資料不完整",
      className: "warn"
    };
  }

  const score = getTotalScore(stock);

  if (score === null) {
    return {
      text: "無評分",
      className: ""
    };
  }

  return {
    text: "資料完整",
    className: "good"
  };
}


/* ============================================================
   25. 股票卡片
   ============================================================ */

function renderStockCard(stock) {
  const info = getStockDisplayInfo(stock);

  const code = info.code;
  const name = info.name;
  const fullName = info.fullName;

  const score = getTotalScore(stock);
  const status = getStockStatus(stock);

  const revenue = getRevenueData(stock);
  const foreign = getForeignHoldingData(stock);
  const technical = getTechnicalData(stock);

  const revenueMonth =
    revenue.latest_month ??
    revenue.latestMonth ??
    revenue.month ??
    revenue.latest_date ??
    "—";

  const revenueGrowth =
    revenue.yoy ??
    revenue.yoy_growth ??
    revenue.year_on_year ??
    revenue.growth;

  const foreignRatio =
    foreign.ratio ??
    foreign.holding_ratio ??
    foreign.foreign_holding_ratio ??
    foreign.percent ??
    foreign.percentage;

  const technicalTrend =
    technical.trend ??
    technical.signal ??
    technical.summary ??
    "—";

  const technicalClose =
    technical.close ??
    technical.price ??
    technical.latest_price ??
    technical.latest_close;

  const institutional =
    getInstitutionalData(stock);

  const institutionalTotal =
    institutional.latest
      ? validNumber(institutional.latest.total)
      : null;

  const cardScore =
    score === null
      ? "—"
      : fmt(score, 1);

  const scoreColorValue =
    scoreColor(score);

  return `
    <article
      class="stock-card"
      data-code="${escapeHTML(code)}"
    >

      <!-- 股票名稱與代碼 -->

      <div class="stock-header">

        <div>
          <div class="stock-id">
            ${escapeHTML(code)}
          </div>

          <div class="company-short">
            ${escapeHTML(name)}
          </div>

          ${
            fullName && fullName !== name
              ? `
                <div class="company-full">
                  ${escapeHTML(fullName)}
                </div>
              `
              : ""
          }
        </div>

        <span class="status ${status.className}">
          ${escapeHTML(status.text)}
        </span>

      </div>


      <!-- 綜合評分 -->

      <div class="score-area">

        <div>
          <div
            class="score"
            style="color:${scoreColorValue};"
          >
            ${cardScore}
          </div>

          <div class="score-label">
            綜合評分 / 100
          </div>
        </div>

        <div class="score-status">
          <div style="color:${scoreColorValue};">
            ${escapeHTML(scoreStatus(score))}
          </div>

          <div class="score-label">
            評分狀態
          </div>
        </div>

      </div>


      <!-- 主要指標 -->

      <div class="metrics">

        ${metricBox(
          "最新營收月份",
          escapeHTML(revenueMonth || "—")
        )}

        ${metricBox(
          "營收年增率",
          revenueGrowth === undefined ||
          revenueGrowth === null ||
          revenueGrowth === ""
            ? "—"
            : signedPercent(revenueGrowth, 2)
        )}

        ${metricBox(
          "外資持股比例",
          foreignRatio === undefined ||
          foreignRatio === null ||
          foreignRatio === ""
            ? '<span style="color:var(--yellow);">資料不足</span>'
            : signedPercent(foreignRatio, 2)
        )}

      </div>


      <!-- 技術與籌碼摘要 -->

      <div class="indicator-grid">

        <div class="indicator">
          <div class="indicator-label">
            技術分析
          </div>

          <div class="indicator-value">
            ${
              technicalClose === undefined ||
              technicalClose === null ||
              technicalClose === ""
                ? "收盤價：—"
                : "收盤價：" + fmt(technicalClose, 2)
            }
          </div>

          <div class="small-note">
            ${escapeHTML(technicalTrend)}
          </div>
        </div>

        <div class="indicator">
          <div class="indicator-label">
            三大法人
          </div>

          <div class="indicator-value ${
            institutionalTotal > 0
              ? "trend-up"
              : institutionalTotal < 0
                ? "trend-down"
                : ""
          }">
            ${
              institutionalTotal === null
                ? "合計：—"
                : "合計：" + fmtVolume(institutionalTotal)
            }
          </div>

          <div class="small-note">
            ${
              institutional.latest?.date
                ? "日期：" + escapeHTML(institutional.latest.date)
                : "法人資料"
            }
          </div>
        </div>

      </div>


      <!-- 三大評分組成 -->

      ${renderScoreBreakdown(stock)}


      <!-- 三大法人詳細資料 -->

      <details class="details">
        <summary>三大法人買賣超明細</summary>
        ${renderInstitutionalDetails(stock)}
      </details>


      <!-- 技術分析詳細資料 -->

      <details class="details">

        ${renderTechnicalDetails(stock)}
      </details>


      <!-- 完整資料 -->

      <details class="details">

        ${renderDetailedData(stock)}
      </details>

    </article>
  `;
}


/* ============================================================
   26. 搜尋與排序
   ============================================================ */

function getFilteredStocks() {
  const searchInput =
    document.getElementById("searchInput");

  const sortSelect =
    document.getElementById("sortSelect");

  const keyword =
    (searchInput?.value || "")
      .trim()
      .toLowerCase();

  const sortMode =
    sortSelect?.value || "code";

  let stocks =
    Array.from(analysisMap.values());

  /*
    搜尋：
    股票代碼、中文名稱、公司全名
  */

  if (keyword) {
    stocks = stocks.filter(stock => {
      const info = getStockDisplayInfo(stock);

      const code = String(info.code || "").toLowerCase();
      const name = String(info.name || "").toLowerCase();
      const fullName = String(info.fullName || "").toLowerCase();

      return (
        code.includes(keyword) ||
        name.toLowerCase().includes(keyword) ||
        fullName.toLowerCase().includes(keyword)
      );
    });
  }

  /*
    排序
  */

  stocks.sort((a, b) => {
    const infoA = getStockDisplayInfo(a);
    const infoB = getStockDisplayInfo(b);

    const scoreA = getTotalScore(a);
    const scoreB = getTotalScore(b);

    if (sortMode === "name") {
      return infoA.name.localeCompare(
        infoB.name,
        "zh-TW"
      );
    }

    if (sortMode === "scoreDesc") {
      if (scoreA === null && scoreB === null) {
        return infoA.code.localeCompare(infoB.code);
      }

      if (scoreA === null) {
        return 1;
      }

      if (scoreB === null) {
        return -1;
      }

      return scoreB - scoreA;
    }

    if (sortMode === "scoreAsc") {
      if (scoreA === null && scoreB === null) {
        return infoA.code.localeCompare(infoB.code);
      }

      if (scoreA === null) {
        return 1;
      }

      if (scoreB === null) {
        return -1;
      }

      return scoreA - scoreB;
    }

    return infoA.code.localeCompare(
      infoB.code,
      undefined,
      { numeric: true }
    );
  });

  return stocks;
}


/* ============================================================
   27. 更新畫面
   ============================================================ */

function render() {
  const grid =
    document.getElementById("stockGrid");

  const message =
    document.getElementById("message");

  if (!grid || !message) {
    return;
  }

  const stocks = getFilteredStocks();

  if (stocks.length === 0) {
    grid.innerHTML = `
      <div class="empty">
        <div style="font-size:18px;margin-bottom:8px;">
          找不到符合條件的股票
        </div>

        <div>
          請確認搜尋文字，或確認 analysis.json 是否已有分析結果。
        </div>
      </div>
    `;

    message.textContent =
      "目前沒有符合搜尋條件的分析結果。";

    return;
  }

  grid.innerHTML = stocks
    .map(stock => renderStockCard(stock))
    .join("");

  const completeCount = stocks.filter(
    stock => getDataQuality(stock).complete
  ).length;

  const incompleteCount =
    stocks.length - completeCount;

  const updateText =
    analysisUpdateTime
      ? "資料更新時間：" + analysisUpdateTime
      : "資料更新時間：未提供";

  const countText =
    "目前顯示 " + stocks.length + " 檔";

  const completeText =
    "資料完整 " + completeCount + " 檔";

  const incompleteText =
    "資料不完整 " + incompleteCount + " 檔";

  message.textContent = [
    updateText,
    countText,
    completeText,
    incompleteText
  ].join("｜");
}


/* ============================================================
   28. 讀取 analysis.json
   ============================================================ */

async function refreshAnalysis() {
  if (loading) {
    return;
  }

  loading = true;

  const grid =
    document.getElementById("stockGrid");

  const message =
    document.getElementById("message");

  const updateTime =
    document.getElementById("updateTime");

  const refreshBtn =
    document.getElementById("refreshBtn");

  if (grid) {
    grid.classList.add("loading");
  }

  if (refreshBtn) {
    refreshBtn.disabled = true;
    refreshBtn.textContent = "載入中…";
  }

  if (message) {
    message.textContent = "正在讀取分析資料…";
  }

  try {
    const response = await fetch(
      "./analysis.json?t=" + Date.now(),
      {
        cache: "no-store"
      }
    );

    if (!response.ok) {
      throw new Error(
        "analysis.json HTTP " + response.status
      );
    }

    const data = await response.json();

    /*
      相容格式：
      {
        "update_time": "...",
        "stocks": [...]
      }
    */

    if (!Array.isArray(data.stocks)) {
      throw new Error(
        "analysis.json 缺少 stocks 陣列"
      );
    }

    analysisMap.clear();

    for (const stock of data.stocks) {
      if (!stock || typeof stock !== "object") {
        continue;
      }

      const code = normalizeCode(
        stock.stock_id ??
        stock.stockId ??
        stock.code
      );

      if (!code) {
        continue;
      }

      /*
        保留原始資料所有欄位，
        僅補入統一使用的 stock_id。
      */

      const normalizedStock = {
        ...stock,
        stock_id: code
      };

      analysisMap.set(
        code,
        normalizedStock
      );
    }

    analysisUpdateTime =
      data.update_time ||
      data.updateTime ||
      "";

    analysisMeta = {
      stock_count:
        validNumber(data.stock_count) ??
        analysisMap.size,

      complete_count:
        validNumber(data.complete_count),

      technical_count:
        validNumber(data.technical_count)
    };

    if (updateTime) {
      updateTime.textContent =
        "更新時間：" +
        (analysisUpdateTime || "未提供") +
        "｜分析股票：" +
        analysisMap.size +
        " 檔";
    }

    render();

    /*
      額外補充分析統計資訊
    */

    const technicalCount =
      analysisMeta.technical_count;

    const completeCount =
      analysisMeta.complete_count;

    if (message) {
      const parts = [
        "資料更新時間：" +
          (analysisUpdateTime || "未提供"),

        "分析股票：" +
          analysisMap.size +
          " 檔"
      ];

      if (technicalCount !== null) {
        parts.push(
          "技術分析：" +
          technicalCount +
          " 檔"
        );
      }

      if (completeCount !== null) {
        parts.push(
          "資料完整：" +
          completeCount +
          " 檔"
        );
      }

      message.textContent = parts.join("｜");
    }

  } catch (error) {
    console.error(
      "載入 analysis.json 失敗：",
      error
    );

    if (message) {
      message.textContent =
        "載入分析資料失敗：" +
        error.message +
        "。請確認 analysis.json 路徑與 JSON 格式。";
    }

    if (grid && analysisMap.size === 0) {
      grid.innerHTML = `
        <div class="empty">
          <div style="font-size:18px;margin-bottom:8px;">
            無法載入分析資料
          </div>

          <div>
            請確認 analysis.json 是否存在、
            JSON 格式是否正確，以及網站部署路徑是否正確。
          </div>
        </div>
      `;
    }

  } finally {
    loading = false;

    if (grid) {
      grid.classList.remove("loading");
    }

    if (refreshBtn) {
      refreshBtn.disabled = false;
      refreshBtn.textContent = "↻ 重新整理";
    }
  }
}


/* ============================================================

document
