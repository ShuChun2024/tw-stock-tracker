<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101827">
<title>台股分析儀表板</title>

<style>
:root {
  color-scheme: dark;
  --bg: #0b1120;
  --panel: #151f32;
  --panel2: #1c2940;
  --text: #eef3fc;
  --muted: #9aa9c0;
  --border: #2c3a52;
  --green: #42d392;
  --red: #ff737e;
  --yellow: #f4c76b;
  --blue: #7bb6ff;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
    "Microsoft JhengHei", sans-serif;
  line-height: 1.6;
}
.container {
  max-width: 1100px;
  margin: auto;
  padding: 20px 16px 40px;
}
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}
h1 { font-size: 25px; margin: 0; }
h2 { font-size: 18px; margin: 0 0 12px; }
p { margin: 5px 0; }
.muted { color: var(--muted); font-size: 13px; }
button, select {
  color: var(--text);
  background: var(--panel2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 12px;
  font-size: 14px;
}
button { cursor: pointer; }
button:hover { border-color: var(--blue); }
.summary {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
  margin-bottom: 20px;
}
.panel, .metric, .stock-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 15px;
}
.metric { padding: 15px; }
.metric .label { color: var(--muted); font-size: 13px; }
.metric .value { font-size: 25px; font-weight: 750; }
.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  flex-wrap: wrap;
  margin: 18px 0 12px;
}
.stock-list {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}
.stock-card { padding: 16px; min-width: 0; }
.stock-head {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: flex-start;
}
.stock-id { font-size: 22px; font-weight: 800; }
.status {
  display: inline-block;
  border: 1px solid var(--border);
  padding: 4px 9px;
  border-radius: 999px;
  font-size: 12px;
  white-space: nowrap;
}
.status.strong { color: var(--green); }
.status.weak { color: var(--red); }
.status.neutral { color: var(--yellow); }
.score {
  font-size: 34px;
  font-weight: 800;
  margin: 12px 0 2px;
}
.score-label { color: var(--muted); font-size: 12px; }
.progress {
  height: 7px;
  background: #29354a;
  border-radius: 20px;
  overflow: hidden;
  margin: 9px 0 16px;
}
.progress-fill {
  height: 100%;
  background: var(--blue);
  width: 0%;
  border-radius: 20px;
}
.data-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}
.data-box {
  background: var(--panel2);
  border-radius: 10px;
  padding: 11px;
  min-width: 0;
}
.data-box .label { color: var(--muted); font-size: 12px; }
.data-box .value {
  font-size: 16px;
  font-weight: 700;
  overflow-wrap: anywhere;
}
.details {
  border-top: 1px solid var(--border);
  margin-top: 14px;
  padding-top: 12px;
}
details summary {
  cursor: pointer;
  color: var(--blue);
  font-size: 14px;
}
.details-content { padding-top: 10px; font-size: 13px; }
.notice {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 15px;
  margin: 12px 0;
}
.error { color: var(--red); }
footer {
  margin-top: 24px;
  text-align: center;
  color: var(--muted);
  font-size: 12px;
}
@media (max-width: 650px) {
  .container { padding: 16px 12px 30px; }
  h1 { font-size: 22px; }
  .summary { grid-template-columns: 1fr; gap: 8px; }
  .metric { padding: 12px 14px; }
  .metric .value { font-size: 22px; }
  .stock-list { grid-template-columns: 1fr; }
  .stock-card { padding: 14px; }
}
</style>
</head>

<body>
<div class="container">
  <header>
    <div>
      <h1>📈 台股分析儀表板</h1>
      <p class="muted">營收趨勢・外資持股・綜合評分</p>
    </div>
    <button id="refreshBtn" type="button">↻ 重新載入</button>
  </header>

  <div id="message" class="notice" role="status">
    正在讀取股票分析資料……
  </div>

  <section class="summary" aria-label="分析摘要">
    <div class="metric">
      <div class="label">分析股票數</div>
      <div class="value" id="stockCount">—</div>
    </div>
    <div class="metric">
      <div class="label">有效評分數</div>
      <div class="value" id="completeCount">—</div>
    </div>
    <div class="metric">
      <div class="label">資料更新時間</div>
      <div class="value" id="updateTime" style="font-size:15px">—</div>
    </div>
  </section>

  <div class="toolbar">
    <h2>股票清單</h2>
    <label>
      <span class="muted">排序：</span>
      <select id="sortSelect">
        <option value="score">總分由高到低</option>
        <option value="scoreAsc">總分由低到高</option>
        <option value="id">股票代號</option>
      </select>
    </label>
  </div>

  <section id="stockList" class="stock-list"
           aria-live="polite"></section>

  <footer>
    本頁僅呈現程式產生的分析資料，不構成投資建議。
  </footer>
</div>

<script>
"use strict";

let stockData = [];
let fileData = {};

const $ = (id) => document.getElementById(id);

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[ch]);
}

function isValidNumber(value) {
  return value !== null &&
         value !== undefined &&
         value !== "" &&
         Number.isFinite(Number(value));
}

function numberText(value, digits = 2) {
  if (!isValidNumber(value)) return "資料不足";
  return Number(value).toLocaleString("zh-TW", {
    maximumFractionDigits: digits
  });
}

function moneyText(value) {
  if (!isValidNumber(value)) return "資料不足";
  const n = Number(value);
  if (Math.abs(n) >= 1e8) {
    return (n / 1e8).toLocaleString("zh-TW", {
      maximumFractionDigits: 2
    }) + " 億";
  }
  return n.toLocaleString("zh-TW", {
    maximumFractionDigits: 0
  });
}

function percentText(value) {
  if (!isValidNumber(value)) return "資料不足";
  return numberText(value) + "%";
}

function getStatusClass(status) {
  const s = String(status || "");
  if (s.includes("強勢")) return "strong";
  if (s.includes("弱勢")) return "weak";
  return "neutral";
}

function getScore(stock) {
  return isValidNumber(stock.score) ? Number(stock.score) : null;
}

function showMessage(message, isError = false) {
  const el = $("message");
  el.textContent = message;
  el.className = "notice" + (isError ? " error" : "");
}

function renderStocks() {
  const sort = $("sortSelect").value;
  const stocks = [...stockData];

  stocks.sort((a, b) => {
    const sa = getScore(a);
    const sb = getScore(b);

    if (sort === "id") {
      return String(a.stock_id || "").localeCompare(
        String(b.stock_id || ""), "zh-TW"
      );
    }
    if (sa === null && sb !== null) return 1;
    if (sb === null && sa !== null) return -1;
    if (sa === null && sb === null) return 0;
    return sort === "scoreAsc" ? sa - sb : sb - sa;
  });

  const list = $("stockList");

  if (!stocks.length) {
    list.innerHTML = "";
    showMessage("analysis.json 中沒有可顯示的股票資料。", true);
    return;
  }

  list.innerHTML = stocks.map(stock => {
    const revenue = stock.revenue || {};
    const foreign = stock.foreign_holding ||
                    stock.big_holder || {};
    const score = getScore(stock);
    const status = stock.status || "⚪ 資料不足";
    const scoreLabel = score === null
      ? "資料不足"
      : numberText(score) + " / 100";

    const scoreWidth = score === null
      ? 0
      : Math.max(0, Math.min(100, score));

    const trend = revenue.trend || "資料不足";
    const foreignTrend = foreign.trend || "資料不足";
    const revenueScore = isValidNumber(revenue.score)
      ? numberText(revenue.score) + " 分"
      : "資料不足";
    const foreignScore = isValidNumber(foreign.score)
      ? numberText(foreign.score) + " 分"
      : "資料不足";

    const revenueMessage = revenue.message || "無補充說明";
    const foreignMessage = foreign.message || "無補充說明";

    const latestRevenue = moneyText(revenue.latest_revenue);
    const yoy = percentText(revenue.latest_yoy);
    const foreignRatio = percentText(foreign.latest_percent);

    const analysisDate = escapeHTML(stock.analysis_date || "—");
    const stockId = escapeHTML(stock.stock_id || "未知");
    const statusClass = getStatusClass(status);

    return `
      <article class="stock-card">
        <div class="stock-head">
          <div>
            <div class="stock-id">${stockId}</div>
            <div class="muted">分析日期：${analysisDate}</div>
          </div>
          <span class="status ${statusClass}">
            ${escapeHTML(status)}
          </span>
        </div>

        <div class="score">${score === null ? "—" : numberText(score)}</div>
        <div class="score-label">綜合評分：${scoreLabel}</div>
        <div class="progress">
          <div class="progress-fill" style="width:${scoreWidth}%"></div>
        </div>

        <div class="data-grid">
          <div class="data-box">
            <div class="label">最新月營收</div>
            <div class="value">${latestRevenue}</div>
          </div>
          <div class="data-box">
            <div class="label">營收年增率</div>
            <div class="value">${yoy}</div>
          </div>
          <div class="data-box">
            <div class="label">外資持股比例</div>
            <div class="value">${foreignRatio}</div>
          </div>
          <div class="data-box">
            <div class="label">營收趨勢</div>
            <div class="value">${escapeHTML(trend)}</div>
          </div>
        </div>

        <div class="details">
          <details>
            <summary>查看詳細分析與資料品質</summary>
            <div class="details-content">
              <p><strong>營收指標分數：</strong>${escapeHTML(revenueScore)}</p>
              <p><strong>營收分析：</strong>${escapeHTML(revenueMessage)}</p>
              <p><strong>外資指標分數：</strong>${escapeHTML(foreignScore)}</p>
              <p><strong>外資趨勢：</strong>${escapeHTML(foreignTrend)}</p>
              <p><strong>外資分析：</strong>${escapeHTML(foreignMessage)}</p>
              <p><strong>綜合狀態：</strong>${escapeHTML(status)}</p>
              <p><strong>資料品質：</strong>${escapeHTML(
                typeof stock.data_quality === "string"
                  ? stock.data_quality
                  : JSON.stringify(stock.data_quality ?? "未提供")
              )}</p>
            </div>
          </details>
        </div>
      </article>
    `;
  }).join("");
}

async function loadData() {
  const btn = $("refreshBtn");
  btn.disabled = true;
  showMessage("正在讀取 analysis.json……");

  try {
    // 加入時間參數，避免瀏覽器沿用舊快取
    const response = await fetch(
      "./analysis.json?t=" + Date.now(),
      { cache: "no-store" }
    );

    if (!response.ok) {
      throw new Error(
        "讀取失敗，HTTP 狀態碼：" + response.status
      );
    }

    const data = await response.json();

    if (!data || !Array.isArray(data.stocks)) {
      throw new Error("analysis.json 格式不符，找不到 stocks 陣列。");
    }

    fileData = data;
    stockData = data.stocks;

    $("stockCount").textContent =
      isValidNumber(data.stock_count)
        ? data.stock_count
        : stockData.length;

    const validCount = stockData.filter(
      s => getScore(s) !== null
    ).length;

    $("completeCount").textContent =
      isValidNumber(data.complete_count)
        ? data.complete_count
        : validCount;

    $("updateTime").textContent =
      data.update_time || "未提供";

    renderStocks();

    showMessage(
      "資料載入成功，共 " + stockData.length +
      " 檔股票；有效評分 " + validCount + " 檔。"
    );
  } catch (error) {
    console.error(error);
    showMessage(
      "無法載入資料：" + error.message +
      "。請確認 analysis.json 已存在，且網站與 JSON 位於同一目錄。",
      true
    );
  } finally {
    btn.disabled = false;
  }
}

$("refreshBtn").addEventListener("click", loadData);
$("sortSelect").addEventListener("change", renderStocks);

loadData();
</script>
</body>
</html>
