<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101827">
<title>台股分析儀表板</title>

<style>
:root {
  color-scheme: dark;
  --bg: #101827;
  --panel: #1b2638;
  --border: #334155;
  --text: #e5edf7;
  --muted: #9aabc1;
  --red: #ff7272;
  --green: #4ade80;
  --blue: #60a5fa;
  --yellow: #fbbf24;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, "Microsoft JhengHei", sans-serif;
}
.container { max-width: 1200px; margin: auto; padding: 18px; }
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
h1 { font-size: 23px; margin: 8px 0; }
h2 { font-size: 17px; margin: 0 0 12px; }
button, input, select {
  background: #263449;
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px;
  font-size: 14px;
}
button { cursor: pointer; }
button:hover { border-color: var(--blue); }
button:disabled { opacity: .55; cursor: wait; }
a { color: var(--blue); text-decoration: none; }
.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 16px 0;
}
.toolbar input { flex: 1; min-width: 150px; }
#message {
  color: var(--muted);
  font-size: 13px;
  margin: 12px 0;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.stock-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 14px;
}
.stock-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px;
  min-width: 0;
}
.stock-header {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: flex-start;
}
.stock-id { font-size: 19px; font-weight: bold; }
.company-short { font-size: 17px; font-weight: bold; margin-top: 5px; }
.company-full {
  font-size: 12px;
  color: var(--muted);
  margin-top: 4px;
  overflow-wrap: anywhere;
}
.status {
  font-size: 12px;
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 5px 8px;
  white-space: nowrap;
}
.score-area { display: flex; align-items: center; gap: 12px; margin: 18px 0; }
.score { font-size: 38px; font-weight: bold; }
.score-label { font-size: 13px; color: var(--muted); }
.metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.metric { background: #111c2d; border-radius: 9px; padding: 12px; min-width: 0; }
.metric-title { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.metric-value { font-size: 18px; font-weight: bold; overflow-wrap: anywhere; }
.metric-sub { font-size: 12px; color: var(--muted); margin-top: 6px; overflow-wrap: anywhere; }
.positive { color: var(--red); }
.negative { color: var(--green); }
.neutral { color: var(--muted); }
.warning { color: var(--yellow); }

.section {
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}
.section-title {
  font-size: 13px;
  font-weight: bold;
  margin-bottom: 10px;
}
.indicator-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.indicator {
  background: #111c2d;
  border-radius: 8px;
  padding: 10px;
  min-width: 0;
}
.indicator-name { color: var(--muted); font-size: 12px; }
.indicator-value {
  font-size: 16px;
  font-weight: bold;
  margin-top: 5px;
  overflow-wrap: anywhere;
}
.indicator-sub {
  font-size: 12px;
  margin-top: 5px;
  overflow-wrap: anywhere;
}
.score-breakdown {
  display: grid;
  gap: 10px;
}
.score-row {
  display: grid;
  grid-template-columns: 82px 1fr 56px;
  align-items: center;
  gap: 8px;
  font-size: 12px;
}
.score-track {
  height: 8px;
  background: #0b1220;
  border-radius: 20px;
  overflow: hidden;
}
.score-fill {
  height: 100%;
  border-radius: 20px;
  background: var(--blue);
}
.score-row-value { text-align: right; white-space: nowrap; }
.details {
  display: none;
  border-top: 1px solid var(--border);
  margin-top: 12px;
  padding-top: 12px;
  font-size: 13px;
  line-height: 1.8;
  overflow-wrap: anywhere;
}
.details.open { display: block; }
.detail-line { margin: 4px 0; }
.quality { color: var(--yellow); font-size: 12px; margin-top: 10px; line-height: 1.6; }
.footer { font-size: 12px; color: var(--muted); margin: 22px 0 8px; line-height: 1.7; }
.empty { padding: 30px; text-align: center; color: var(--muted); background: var(--panel); border-radius: 12px; }
.disclaimer { color: var(--muted); font-size: 11px; margin-top: 10px; line-height: 1.6; }

@media(max-width:480px) {
  .container { padding: 12px; }
  h1 { font-size: 20px; }
  .score { font-size: 32px; }
  .stock-header { flex-wrap: wrap; }
}
</style>
</head>

<body>
<div class="container">

<header>
  <div>
    <h1>台股分析儀表板</h1>
    <div class="footer" id="updateTime">分析資料載入中…</div>
  </div>

  <div class="toolbar">
    <button id="refreshBtn" type="button">↻ 重新整理</button>
    <a href="./watchlist.html">
      <button type="button">管理觀測股票</button>
    </a>
  </div>
</header>

<div class="toolbar">
  <input id="searchInput" placeholder="搜尋代碼、股票名稱…" aria-label="搜尋股票">

  <select id="sortSelect" aria-label="排序方式">
    <option value="code">依股票代碼排序</option>
    <option value="name">依中文名稱排序</option>
    <option value="scoreDesc">評分由高至低</option>
    <option value="scoreAsc">評分由低至高</option>
  </select>
</div>

<div id="message" role="status">正在讀取分析資料…</div>
<div id="stockGrid" class="stock-grid"></div>

<div class="footer">
  本頁顯示 analysis.json 中已產生的全部分析結果。
  新增觀測股票不代表該股票已完成分析；尚無分析結果的股票不會自動出現在本頁。
  <div class="disclaimer">
    評分是依程式設定的條件計算，不代表獲利保證或個人化投資建議。
    技術指標為歷史行情計算結果，請留意資料日期及市場風險。
  </div>
</div>

</div>

<script>
"use strict";

/* =====================================================
   1. 基本設定
   ===================================================== */

const WATCHLIST_KEY = "twStockWatchlist";
const OLD_WATCHLIST_KEY = "twStockWatchlistV1";

const DEFAULT_STOCKS = [
  { stock_id: "2330", short_name: "台積電", company_name: "台灣積體電路製造股份有限公司" },
  { stock_id: "2454", short_name: "聯發科", company_name: "聯發科技股份有限公司" },
  { stock_id: "2317", short_name: "鴻海", company_name: "鴻海精密工業股份有限公司" },
  { stock_id: "2603", short_name: "長榮", company_name: "長榮海運股份有限公司" }
];

let analysisMap = new Map();
let stockDatabase = new Map();
let analysisUpdateTime = "";
let loading = false;

/* =====================================================
   2. 安全及格式處理
   ===================================================== */

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;",
    '"': "&quot;", "'": "&#39;"
  })[ch]);
}

function normalizeCode(value) {
  const code = String(value ?? "").trim();
  return /^\d{4,6}$/.test(code) ? code : "";
}

function validNumber(value) {
  if (value === null || value === undefined || value === "") return false;
  return Number.isFinite(Number(value));
}

function fmt(value, digits = 2) {
  return validNumber(value) ? Number(value).toFixed(digits) : "—";
}

function signedPercent(value) {
  if (!validNumber(value)) return "—";
  const n = Number(value);
  return (n > 0 ? "+" : "") + n.toFixed(2) + "%";
}

function fmtVolume(value) {
  if (!validNumber(value)) return "—";
  return Math.round(Number(value)).toLocaleString("zh-TW");
}

function scoreText(value) {
  return validNumber(value) ? Number(value).toFixed(1) : "—";
}

function scoreStatus(stock) {
  if (!validNumber(stock.score)) return "資料不足";
  return stock.status || "已完成分析";
}

function scoreColor(score) {
  if (!validNumber(score)) return "neutral";
  if (Number(score) >= 70) return "positive";
  if (Number(score) < 40) return "negative";
  return "neutral";
}

function trendClass(value) {
  const text = String(value ?? "");

  if (/增加|上升|成長|多方|偏強|突破|量增|強勢/.test(text)) {
    return "positive";
  }

  if (/減少|下降|衰退|空方|偏弱|跌破|量縮|弱勢/.test(text)) {
    return "negative";
  }

  if (/超買|超賣|資料不足|不完整/.test(text)) {
    return "warning";
  }

  return "neutral";
}

function normalizeMissingItems(items) {
  if (!Array.isArray(items)) return [];

  return items.map(item => {
    const value = String(item);
    const map = {
      revenue: "營收",
      foreign_holding: "外資持股",
      technical: "技術面"
    };
    return map[value] || value;
  });
}

function metricBox(title, value, sub = "", cls = "neutral") {
  return `
    <div class="indicator">
      <div class="indicator-name">${escapeHTML(title)}</div>
      <div class="indicator-value ${cls}">${escapeHTML(value)}</div>
      <div class="indicator-sub">${escapeHTML(sub)}</div>
    </div>`;
}

/* =====================================================
   3. 讀取本機觀察清單名稱
   ===================================================== */

function getWatchlistNames() {
  const result = new Map();

  for (const key of [WATCHLIST_KEY, OLD_WATCHLIST_KEY]) {
    try {
      const saved = localStorage.getItem(key);
      if (!saved) continue;

      const list = JSON.parse(saved);
      if (!Array.isArray(list)) continue;

      list.forEach(item => {
        if (!item || typeof item !== "object") return;

        const code = normalizeCode(
          item.stock_id ?? item.code ?? item.stockCode
        );
        if (!code) return;

        const shortName =
          item.short_name ?? item.shortName ?? item.name ?? "";
        const companyName =
          item.company_name ?? item.companyName ?? "";

        const existing = result.get(code) || {};

        result.set(code, {
          short_name: String(shortName || existing.short_name || ""),
          company_name: String(companyName || existing.company_name || "")
        });
      });
    } catch (error) {
      console.warn("讀取本機觀察清單失敗：", error);
    }
  }

  return result;
}

/* =====================================================
   4. 讀取 stocks.json
   ===================================================== */

function addDatabaseEntry(codeValue, shortNameValue, companyNameValue) {
  const code = normalizeCode(codeValue);
  if (!code) return;

  stockDatabase.set(code, {
    short_name: String(shortNameValue || "").trim(),
    company_name: String(companyNameValue || "").trim()
  });
}

function parseStockDatabase(data) {
  stockDatabase = new Map();

  const list = Array.isArray(data)
    ? data
    : Array.isArray(data?.stocks)
      ? data.stocks
      : null;

  if (list) {
    list.forEach(item => {
      if (!item || typeof item !== "object") return;

      addDatabaseEntry(
        item.stock_id ?? item.stockId ?? item.stock_code ??
        item.stockCode ?? item.code ?? item.symbol ?? item.id,
        item.short_name ?? item.shortName ?? item.stock_name ??
        item.stockName ?? item.name ?? item.label ?? "",
        item.company_name ?? item.companyName ??
        item.full_name ?? item.fullName ?? ""
      );
    });
    return;
  }

  if (data && typeof data === "object") {
    Object.entries(data).forEach(([code, item]) => {
      if (typeof item === "string") {
        addDatabaseEntry(code, item, "");
        return;
      }

      if (!item || typeof item !== "object") return;

      addDatabaseEntry(
        item.stock_id ?? item.stockId ?? code,
        item.short_name ?? item.shortName ?? item.stock_name ??
        item.stockName ?? item.name ?? item.label ?? "",
        item.company_name ?? item.companyName ??
        item.full_name ?? item.fullName ?? ""
      );
    });
  }
}

async function loadStockDatabase() {
  try {
    const response = await fetch("./stocks.json?t=" + Date.now(), {
      cache: "no-store"
    });

    if (!response.ok) throw new Error("HTTP " + response.status);

    parseStockDatabase(await response.json());

    console.log("股票名稱資料載入完成，共 " + stockDatabase.size + " 檔");
    return true;
  } catch (error) {
    console.error("載入 stocks.json 失敗：", error);
    return false;
  }
}

/* =====================================================
   5. 股票名稱對應
   ===================================================== */

function getStockDisplayInfo(result) {
  const code = normalizeCode(result.stock_id);
  const local = getWatchlistNames().get(code) || {};
  const database = stockDatabase.get(code) || {};
  const defaultItem = DEFAULT_STOCKS.find(x => x.stock_id === code) || {};

  return {
    stock_id: code,
    short_name:
      local.short_name || database.short_name || defaultItem.short_name ||
      result.short_name || result.stock_name || result.name || "",
    company_name:
      local.company_name || database.company_name || defaultItem.company_name ||
      result.company_name || result.company_full_name || ""
  };
}

/* =====================================================
   6. 評分明細
   ===================================================== */

function renderScoreBreakdown(s) {
  const revenue = s.revenue || {};
  const foreign = s.foreign_holding || {};
  const technical = s.technical || {};

  const items = [
    { name: "基本面", score: revenue.score, max: 40 },
    { name: "籌碼面", score: foreign.score, max: 20 },
    { name: "技術面", score: technical.score, max: 40 }
  ];

  return `
    <div class="section">
      <div class="section-title">綜合評分組成</div>
      <div class="score-breakdown">
        ${items.map(item => {
          const available = validNumber(item.score);
          const score = available ? Number(item.score) : 0;
          const width = Math.max(0, Math.min(100, score / item.max * 100));

          return `
            <div class="score-row">
              <span>${item.name}</span>
              <div class="score-track">
                <div class="score-fill" style="width:${width}%"></div>
              </div>
              <span class="score-row-value">${
                available ? `${fmt(score, 1)} / ${item.max}` : "資料不足"
              }</span>
            </div>`;
        }).join("")}
      </div>
    </div>`;
}

/* =====================================================
   7. 技術分析區塊
   ===================================================== */

function renderTechnical(s) {
  const t = s.technical || {};
  const ma = t.ma || {};
  const rsi = t.rsi || {};
  const macd = t.macd || {};
  const kd = t.kd || {};
  const volume = t.volume || {};
  const breakout = t.breakout || {};

  if (t.data_available !== true) {
    return `
      <div class="section">
        <div class="section-title">技術分析</div>
        <div class="quality">${
          escapeHTML(t.message || "尚無技術分析資料")
        }</div>
      </div>`;
  }

  return `
    <div class="section">
      <div class="section-title">技術分析　技術分數：${
        escapeHTML(validNumber(t.score) ? `${fmt(t.score, 1)} / 40` : "—")
      }</div>
      <div class="indicator-grid">
        ${metricBox(
          "均線趨勢",
          ma.trend || "—",
          "MA5 / MA10 / MA20 / MA60",
          trendClass(ma.trend)
        )}
        ${metricBox(
          "RSI(14)",
          fmt(rsi.value),
          rsi.signal || "—",
          trendClass(rsi.signal)
        )}
        ${metricBox(
          "MACD",
          macd.signal || "—",
          `DIF ${fmt(macd.dif, 4)}｜DEA ${fmt(macd.dea, 4)}`,
          trendClass(macd.signal)
        )}
        ${metricBox(
          "KD(9,3,3)",
          `K ${fmt(kd.k)} / D ${fmt(kd.d)}`,
          kd.signal || "—",
          trendClass(kd.signal)
        )}
        ${metricBox(
          "成交量",
          fmtVolume(volume.today),
          `5日均量 ${fmtVolume(volume.avg5)}`,
          trendClass(volume.signal)
        )}
        ${metricBox(
          "量比",
          validNumber(volume.ratio) ? `${fmt(volume.ratio)} 倍` : "—",
          volume.signal || "—",
          trendClass(volume.signal)
        )}
        ${metricBox(
          "MA5",
          fmt(ma.ma5),
          "5日移動平均",
          "neutral"
        )}
        ${metricBox(
          "MA10",
          fmt(ma.ma10),
          "10日移動平均",
          "neutral"
        )}
        ${metricBox(
          "MA20",
          fmt(ma.ma20),
          "20日移動平均",
          "neutral"
        )}
        ${metricBox(
          "MA60",
          fmt(ma.ma60),
          "60日移動平均",
          "neutral"
        )}
        ${metricBox(
          "20日高點",
          fmt(breakout.high20),
          "距高點 " + signedPercent(breakout.distance_to_high20_percent),
          "neutral"
        )}
        ${metricBox(
          "20日低點",
          fmt(breakout.low20),
          "距低點 " + signedPercent(breakout.distance_to_low20_percent),
          "neutral"
        )}
      </div>
      <div class="metric-sub" style="margin-top:10px">
        技術訊號：<span class="${trendClass(breakout.signal)}">${
          escapeHTML(breakout.signal || "—")
        }</span>
        ｜ 技術分析日期：${escapeHTML(t.latest_date || "—")}
        ｜ 收盤價：${escapeHTML(fmt(t.latest_close))}
      </div>
    </div>`;
}

/* =====================================================
   8. 詳細資料
   ===================================================== */

function renderDetails(s) {
  const revenue = s.revenue || {};
  const foreign = s.foreign_holding || {};
  const technical = s.technical || {};
  const quality = s.data_quality || {};
  const missing = normalizeMissingItems(quality.missing_items);

  return `
    <div class="details">
      <div class="detail-line"><strong>分析日期：</strong>${
        escapeHTML(s.analysis_date || analysisUpdateTime || "尚無資料")
      }</div>
      <div class="detail-line"><strong>綜合評分：</strong>${
        escapeHTML(scoreText(s.score))
      } / 100</div>

      <div class="detail-line"><strong>營收最新月份：</strong>${
        escapeHTML(revenue.latest_revenue_month || "—")
      }</div>
      <div class="detail-line"><strong>營收最新金額：</strong>${
        escapeHTML(validNumber(revenue.latest_revenue)
          ? Number(revenue.latest_revenue).toLocaleString("zh-TW")
          : "—")
      }</div>
      <div class="detail-line"><strong>營收年增率：</strong>${
        escapeHTML(signedPercent(revenue.latest_yoy))
      }</div>
      <div class="detail-line"><strong>營收趨勢：</strong>${
        escapeHTML(revenue.trend || "—")
      }</div>
      <div class="detail-line"><strong>營收說明：</strong>${
        escapeHTML(revenue.message || "尚無分析資料")
      }</div>
      <div class="detail-line"><strong>營收分數：</strong>${
        escapeHTML(scoreText(revenue.score))
      } / 40</div>

      <div class="detail-line"><strong>外資持股比例：</strong>${
        escapeHTML(validNumber(foreign.latest_percent)
          ? fmt(foreign.latest_percent, 2) + "%"
          : "—")
      }</div>
      <div class="detail-line"><strong>外資持股日期：</strong>${
        escapeHTML(foreign.latest_date || "—")
      }</div>
      <div class="detail-line"><strong>外資期間變化：</strong>${
        escapeHTML(validNumber(foreign.change_periods)
          ? fmt(foreign.change_periods, 4) + " 個百分點"
          : "—")
      }</div>
      <div class="detail-line"><strong>外資持股趨勢：</strong>${
        escapeHTML(foreign.trend || "—")
      }</div>
      <div class="detail-line"><strong>外資說明：</strong>${
        escapeHTML(foreign.message || "尚無分析資料")
      }</div>
      <div class="detail-line"><strong>外資分數：</strong>${
        escapeHTML(scoreText(foreign.score))
      } / 20</div>

      <div class="detail-line"><strong>技術分數：</strong>${
        escapeHTML(scoreText(technical.score))
      } / 40</div>
      <div class="detail-line"><strong>技術分析說明：</strong>${
        escapeHTML(technical.message || "尚無分析資料")
      }</div>

      <div class="detail-line"><strong>資料完整性：</strong>${
        quality.complete === true ? "完整" :
        quality.complete === false ? "不完整" : "未標示"
      }</div>
      <div class="detail-line"><strong>缺少項目：</strong>${
        escapeHTML(missing.join("、") || "無明確缺項")
      }</div>
    </div>`;
}

/* =====================================================
   9. 首頁卡片
   ===================================================== */

function render() {
  const keyword = document.getElementById("searchInput")
    .value.trim().toLowerCase();
  const sort = document.getElementById("sortSelect").value;

  let stocks = Array.from(analysisMap.values()).map(result => ({
    ...getStockDisplayInfo(result),
    analysis: result
  }));

  stocks = stocks.filter(item => {
    const s = item.analysis || {};
    const text = [
      item.stock_id, item.short_name, item.company_name,
      s.stock_id, s.stock_name, s.status
    ].join(" ").toLowerCase();

    return text.includes(keyword);
  });

  stocks.sort((a, b) => {
    if (sort === "name") {
      return String(a.short_name || a.stock_id).localeCompare(
        String(b.short_name || b.stock_id), "zh-Hant"
      );
    }

    if (sort === "scoreDesc" || sort === "scoreAsc") {
      const av = validNumber(a.analysis?.score) ? Number(a.analysis.score) : null;
      const bv = validNumber(b.analysis?.score) ? Number(b.analysis.score) : null;

      if (av === null && bv !== null) return 1;
      if (av !== null && bv === null) return -1;
      if (av === null && bv === null) {
        return a.stock_id.localeCompare(b.stock_id);
      }

      return sort === "scoreDesc" ? bv - av : av - bv;
    }

    return a.stock_id.localeCompare(b.stock_id);
  });

  const grid = document.getElementById("stockGrid");

  if (!stocks.length) {
    grid.innerHTML = '<div class="empty">目前沒有符合搜尋條件的分析結果。</div>';
    return;
  }

  grid.innerHTML = stocks.map(item => {
    const s = item.analysis || {};
    const revenue = s.revenue || {};
    const foreign = s.foreign_holding || {};
    const quality = s.data_quality || {};
    const missing = normalizeMissingItems(quality.missing_items);

    const revenueValue = validNumber(revenue.latest_yoy)
      ? signedPercent(revenue.latest_yoy)
      : "資料不足";

    const foreignValue = validNumber(foreign.latest_percent)
      ? fmt(foreign.latest_percent) + "%"
      : "資料不足";

    const qualityText =
      quality.complete === false || missing.length
        ? "資料品質提醒：" +
          (missing.length ? "缺少 " + missing.join("、") : "部分資料不完整")
        : "";

    return `
      <article class="stock-card">
        <div class="stock-header">
          <div>
            <div class="stock-id">${escapeHTML(item.stock_id)}</div>
            <div class="company-short">${
              escapeHTML(item.short_name || "名稱待確認")
            }</div>
            <div class="company-full">${
              escapeHTML(item.company_name || "公司全名待確認")
            }</div>
          </div>
          <span class="status">${escapeHTML(scoreStatus(s))}</span>
        </div>

        <div class="score-area">
          <div class="score ${scoreColor(s.score)}">${
            escapeHTML(scoreText(s.score))
          }</div>
          <div>
            <div class="score-label">綜合評分 / 100</div>
            <div class="score-label">${
              escapeHTML(s.status || scoreStatus(s))
            }</div>
          </div>
        </div>

        <div class="metrics">
          <div class="metric">
            <div class="metric-title">最新營收年增率</div>
            <div class="metric-value ${trendClass(revenue.trend)}">${
              escapeHTML(revenueValue)
            }</div>
            <div class="metric-sub">${
              escapeHTML(revenue.latest_revenue_month || "")
            }</div>
          </div>
          <div class="metric">
            <div class="metric-title">外資持股比例</div>
            <div class="metric-value ${trendClass(foreign.trend)}">${
              escapeHTML(foreignValue)
            }</div>
            <div class="metric-sub">${
              escapeHTML(foreign.latest_date || "")
            }</div>
          </div>
        </div>

        ${renderScoreBreakdown(s)}
        ${renderTechnical(s)}

        ${qualityText
          ? `<div class="quality">${escapeHTML(qualityText)}</div>`
          : ""}

        <button class="detail-button" type="button">查看詳細資料</button>
        ${renderDetails(s)}
      </article>`;
  }).join("");

  grid.querySelectorAll(".detail-button").forEach(button => {
    button.addEventListener("click", () => {
      const panel = button.nextElementSibling;
      if (!panel) return;

      const opened = panel.classList.toggle("open");
      button.textContent = opened ? "收合詳細資料" : "查看詳細資料";
    });
  });
}

/* =====================================================
   10. 讀取 analysis.json
   ===================================================== */

async function refreshAnalysis() {
  if (loading) return;

  loading = true;

  const button = document.getElementById("refreshBtn");
  const message = document.getElementById("message");

  button.disabled = true;
  button.textContent = "讀取中…";
  message.textContent = "正在讀取最新分析資料…";

  try {
    const response = await fetch("./analysis.json?t=" + Date.now(), {
      cache: "no-store"
    });

    if (!response.ok) throw new Error("HTTP " + response.status);

    const data = await response.json();
    const stocks = Array.isArray(data) ? data : data.stocks;

    if (!Array.isArray(stocks)) {
      throw new Error("analysis.json 格式不正確，找不到股票分析陣列。");
    }

    const nextMap = new Map();

    stocks.forEach(stock => {
      if (!stock || typeof stock !== "object") return;

      const code = normalizeCode(stock.stock_id);
      if (!code) return;

      nextMap.set(code, { ...stock, stock_id: code });
    });

    analysisMap = nextMap;

    analysisUpdateTime =
      (!Array.isArray(data) && (data.update_time || data.analysis_date)) || "";

    document.getElementById("updateTime").textContent =
      "分析資料更新時間：" + (analysisUpdateTime || "資料未提供");

    const technicalCount = !Array.isArray(data) && validNumber(data.technical_count)
      ? Number(data.technical_count)
      : null;

    const completeCount = !Array.isArray(data) && validNumber(data.complete_count)
      ? Number(data.complete_count)
      : null;

    let summary = `已讀取 ${analysisMap.size} 檔分析結果。股票名稱資料庫共 ${stockDatabase.size} 檔。`;

    if (technicalCount !== null) {
      summary += `\n技術分析成功：${technicalCount} 檔。`;
    }

    if (completeCount !== null) {
      summary += `\n基本面、籌碼面及技術面資料完整：${completeCount} 檔。`;
    }

    message.textContent = summary;
    render();
  } catch (error) {
    message.textContent =
      "讀取分析資料失敗：" + error.message +
      "\n請確認 analysis.json 已成功發布，且 JSON 格式正確。";

    console.error("analysis.json 載入失敗：", error);
  } finally {
    loading = false;
    button.disabled = false;
    button.textContent = "↻ 重新整理";
  }
}

/* =====================================================
   11. 事件與初始化
   ===================================================== */

document.getElementById("refreshBtn").addEventListener("click", async () => {
  await loadStockDatabase();
  await refreshAnalysis();
});

document.getElementById("searchInput").addEventListener("input", render);
document.getElementById("sortSelect").addEventListener("change", render);
window.addEventListener("storage", render);

async function init() {
  await loadStockDatabase();
  await refreshAnalysis();
}

init();
</script>
