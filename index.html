<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101827">
<title>台股分析儀表板</title>

<style>
:root{
  color-scheme:dark;
  --bg:#101827;
  --panel:#1b2535;
  --panel2:#111a29;
  --border:#344155;
  --text:#edf2f8;
  --muted:#9aa8ba;
  --green:#35d07f;
  --red:#ff6574;
  --yellow:#f4c95d;
  --blue:#66aaff;
  --orange:#ffad5c;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",
    "Microsoft JhengHei",sans-serif;
}
.container{max-width:1100px;margin:auto;padding:16px}
h1{margin:0 0 6px;font-size:24px}
.subtitle{color:var(--muted);font-size:13px;margin-bottom:16px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
button{
  border:1px solid var(--border);background:#202c40;color:var(--text);
  border-radius:8px;padding:8px 12px;cursor:pointer;
}
button:hover{background:#29374d}
button.active{background:#315a88}
button:disabled{opacity:.6;cursor:wait}
.status{
  background:var(--panel);border:1px solid var(--border);
  border-radius:10px;padding:10px 12px;margin-bottom:14px;
  font-size:13px;color:var(--muted);overflow-wrap:anywhere;
}
.stock-list{display:flex;flex-direction:column;gap:12px}
.stock-card{
  background:var(--panel);border:1px solid var(--border);
  border-radius:12px;padding:14px;
}
.stock-header{
  display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
}
.stock-title{min-width:0}
.stock-code{font-size:20px;font-weight:700}
.stock-name{color:var(--muted);font-size:14px;margin-top:2px}
.score-box{text-align:right;min-width:70px}
.score{font-size:25px;font-weight:700}
.score-label{font-size:11px;color:var(--muted)}
.score-good{color:var(--green)}
.score-mid{color:var(--yellow)}
.score-bad{color:var(--red)}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.metric{background:var(--panel2);border-radius:9px;padding:10px}
.metric-label{color:var(--muted);font-size:12px;margin-bottom:4px}
.metric-value{font-size:16px;font-weight:600;overflow-wrap:anywhere}

/* 三大法人摘要 */
.chip-title{margin-top:12px;margin-bottom:7px;font-size:13px;font-weight:600}
.chip-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip-item{background:var(--panel2);border-radius:9px;padding:9px 8px;min-width:0}
.chip-label{color:var(--muted);font-size:11px;margin-bottom:4px}
.chip-value{
  font-size:14px;font-weight:600;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;
}
.chip-sub{margin-top:3px;font-size:10px;color:var(--muted)}
.chip-positive{color:var(--green)}
.chip-negative{color:var(--red)}
.chip-neutral{color:var(--text)}

/* 三大法人詳細 */
.institutional-summary{
  padding:8px 10px;background:#182336;border-radius:7px;
  margin-bottom:8px;font-size:12px;
}
.institutional-date{color:var(--muted);margin-bottom:3px}
.institutional-summary-text{font-weight:600}
.institutional-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.institutional-card{background:#111a29;border-radius:8px;padding:9px;min-width:0}
.institutional-card-title{font-size:13px;font-weight:600;margin-bottom:6px}
.institutional-card-row{
  display:flex;justify-content:space-between;gap:5px;padding:3px 0;
  font-size:11px;border-bottom:1px solid rgba(255,255,255,.04);
}
.institutional-card-row:last-child{border-bottom:none}
.institutional-card-label{color:var(--muted);flex-shrink:0}
.institutional-card-value{text-align:right;overflow-wrap:anywhere}

/* 評分 */
.score-breakdown{
  margin-top:12px;background:var(--panel2);border-radius:9px;padding:10px;
}
.score-breakdown-title{font-size:13px;font-weight:600;margin-bottom:8px}
.score-row{
  display:grid;grid-template-columns:105px 1fr 88px;
  align-items:center;gap:8px;margin:8px 0;font-size:12px;
}
.score-bar{height:7px;background:#293548;border-radius:10px;overflow:hidden}
.score-fill{height:100%;border-radius:10px}
.score-number{text-align:right;color:var(--muted)}

/* 技術分析 */
.technical-summary{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;
}
.technical-summary-item{background:var(--panel2);border-radius:8px;padding:8px}
.technical-summary-label{color:var(--muted);font-size:11px}
.technical-summary-value{font-size:13px;font-weight:600;margin-top:3px;overflow-wrap:anywhere}
.technical-toggle,.detail-toggle{
  width:100%;margin-top:9px;text-align:center;font-size:12px;
}
.technical-details,.details{
  display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);
}
.technical-details.open,.details.open{display:block}

/* 詳細資料 */
.detail-section{
  background:var(--panel2);border-radius:8px;padding:10px;margin-bottom:8px;
}
.detail-section-title{font-size:13px;font-weight:600;margin-bottom:8px}
.detail-row{
  display:flex;justify-content:space-between;gap:12px;padding:4px 0;
  font-size:12px;border-bottom:1px solid rgba(255,255,255,.04);
}
.detail-row:last-child{border-bottom:none}
.detail-label{color:var(--muted);flex-shrink:0}
.detail-value{text-align:right;overflow-wrap:anywhere;min-width:0}
.quality-warning{
  margin-top:10px;padding:8px 10px;border-radius:8px;
  background:rgba(244,201,93,.08);border:1px solid rgba(244,201,93,.25);
  color:var(--yellow);font-size:12px;overflow-wrap:anywhere;
}
.no-data{color:var(--muted)}
.error{color:var(--red)}
.empty{text-align:center;color:var(--muted);padding:30px 10px}

@media(max-width:600px){
  .container{padding:10px}
  h1{font-size:21px}
  .stock-card{padding:12px}
  .stock-code{font-size:18px}
  .score{font-size:22px}
  .metrics{gap:8px}
  .metric{padding:8px}
  .metric-value{font-size:14px}
  .chip-summary{gap:6px}
  .chip-item{padding:8px 6px}
  .chip-value{font-size:12px}
  .chip-sub{font-size:9px}
  .institutional-grid{grid-template-columns:1fr}
  .score-row{grid-template-columns:90px 1fr 78px;gap:6px}
}
</style>
</head>

<body>
<div class="container">
  <h1>台股分析儀表板</h1>
  <div class="subtitle">基本面 × 籌碼面 × 技術面</div>

  <div class="toolbar">
    <button id="btnAll" class="active">全部</button>
    <button id="btnWatch">觀察清單</button>
    <button id="btnRefresh">重新整理</button>
  </div>

  <div id="status" class="status">載入資料中...</div>
  <div id="stockList" class="stock-list"></div>
</div>

<script>
"use strict";

/* ============================================================
   全域資料
   ============================================================ */

let analysisData = [];
let stockNames = {};
let watchlist = [];
let currentMode = "all";

/* ============================================================
   基本工具
   ============================================================ */

function validNumber(value) {
  if (value === null || value === undefined || value === "") {
    return false;
  }
  return Number.isFinite(Number(value));
}

function numberText(value, digits = 2) {
  if (!validNumber(value)) return "—";
  return Number(value).toFixed(digits);
}

function scoreClass(score) {
  if (!validNumber(score)) return "";
  if (Number(score) >= 70) return "score-good";
  if (Number(score) >= 50) return "score-mid";
  return "score-bad";
}

function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function getStockId(stock) {
  return String(
    stock?.stock_id ??
    stock?.stock_code ??
    stock?.code ??
    ""
  ).trim();
}

/* ============================================================
   股票名稱
   stocks.json 格式：
   {
     "update_time": "...",
     "stock_count": 1988,
     "stocks": [
       {
         "stock_id": "1101",
         "short_name": "台泥",
         "company_name": "臺灣水泥股份有限公司",
         "market": "TWSE"
       }
     ]
   }
   ============================================================ */

function getStockName(stockId, stock) {
  const id = String(stockId ?? "").trim();

  if (stock) {
    const directName =
      stock.short_name ||
      stock.stock_name ||
      stock.stockName ||
      stock.name;

    if (
      typeof directName === "string" &&
      directName.trim() &&
      directName.trim() !== "名稱待確認"
    ) {
      return directName.trim();
    }
  }

  const mapped = stockNames[id];

  if (typeof mapped === "string" && mapped.trim()) {
    return mapped.trim();
  }

  if (mapped && typeof mapped === "object") {
    const mappedName =
      mapped.short_name ||
      mapped.stock_name ||
      mapped.stockName ||
      mapped.name ||
      mapped.company_name ||
      mapped.companyName;

    if (typeof mappedName === "string" && mappedName.trim()) {
      return mappedName.trim();
    }
  }

  return "名稱待確認";
}

async function loadStockNames() {
  try {
    const response = await fetch(
      "./stocks.json?t=" + Date.now(),
      { cache: "no-store" }
    );

    if (!response.ok) {
      throw new Error("stocks.json HTTP " + response.status);
    }

    const data = await response.json();
    const names = {};

    const stockArray = Array.isArray(data)
      ? data
      : Array.isArray(data?.stocks)
        ? data.stocks
        : [];

    stockArray.forEach(item => {
      if (!item || typeof item !== "object") return;

      const id = String(
        item.stock_id ??
        item.stock_code ??
        item.code ??
        item.symbol ??
        ""
      ).trim();

      // 你的資料使用 short_name，因此優先取股票簡稱
      const name =
        item.short_name ||
        item.stock_name ||
        item.stockName ||
        item.name ||
        item.company_name ||
        item.companyName ||
        "";

      if (id && String(name).trim()) {
        names[id] = String(name).trim();
      }
    });

    // 同時支援 {"1101":"台泥"} 這種物件格式
    if (!stockArray.length && data && typeof data === "object") {
      Object.entries(data).forEach(([key, value]) => {
        if (typeof value === "string" && value.trim()) {
          names[String(key).trim()] = value.trim();
        } else if (value && typeof value === "object") {
          const id = String(
            value.stock_id ??
            value.stock_code ??
            value.code ??
            key
          ).trim();

          const name =
            value.short_name ||
            value.stock_name ||
            value.stockName ||
            value.name ||
            value.company_name ||
            value.companyName ||
            "";

          if (id && typeof name === "string" && name.trim()) {
            names[id] = name.trim();
          }
        }
      });
    }

    stockNames = names;

    console.log(
      "股票名稱載入完成，共 " +
      Object.keys(stockNames).length +
      " 筆"
    );
  } catch (error) {
    console.error("stocks.json 載入失敗：", error);
    stockNames = {};
  }
}

/* ============================================================
   三大法人資料
   ============================================================ */

function getInstitutional(s) {
  return s.institutional || {};
}

function getInstitutionMetric(s, type) {
  const institutional = getInstitutional(s);

  return institutional[type] || {
    latest_net_shares: null,
    latest_net_lots: null,
    net_5d_shares: null,
    net_5d_lots: null,
    net_20d_shares: null,
    net_20d_lots: null,
    consecutive_days: 0,
    trend: "資料不足"
  };
}

function getNetText(metric) {
  if (!metric || !validNumber(metric.latest_net_lots)) {
    return "資料不足";
  }

  const value = Number(metric.latest_net_lots);

  if (value > 0) return "買超 " + numberText(value, 1) + " 張";
  if (value < 0) return "賣超 " + numberText(Math.abs(value), 1) + " 張";
  return "持平";
}

function getNetClass(metric) {
  if (metric && validNumber(metric.latest_net_lots)) {
    const value = Number(metric.latest_net_lots);
    if (value > 0) return "chip-positive";
    if (value < 0) return "chip-negative";
  }
  return "chip-neutral";
}

function getConsecutiveText(metric) {
  if (
    !metric ||
    !validNumber(metric.consecutive_days) ||
    Number(metric.consecutive_days) === 0
  ) {
    return "";
  }

  const days = Math.abs(Number(metric.consecutive_days));
  const trend = String(metric.trend || "");

  if (trend.includes("賣")) {
    return "連續賣超 " + days + " 日";
  }

  if (trend.includes("買")) {
    return "連續買超 " + days + " 日";
  }

  return "連續 " + days + " 日";
}

/* ============================================================
   三大法人摘要
   ============================================================ */

function renderInstitutionalSummary(s) {
  const foreign = getInstitutionMetric(s, "foreign");
  const trust = getInstitutionMetric(s, "trust");
  const dealer = getInstitutionMetric(s, "dealer");

  const items = [
    { name: "外資", metric: foreign },
    { name: "投信", metric: trust },
    { name: "自營商", metric: dealer }
  ];

  return `
    <div class="chip-title">三大法人籌碼</div>
    <div class="chip-summary">
      ${items.map(item => `
        <div class="chip-item">
          <div class="chip-label">${item.name}</div>
          <div class="chip-value ${getNetClass(item.metric)}">
            ${escapeHtml(getNetText(item.metric))}
          </div>
          <div class="chip-sub">
            ${escapeHtml(getConsecutiveText(item.metric))}
          </div>
        </div>
      `).join("")}
    </div>
  `;
}

/* ============================================================
   三大法人詳細資料
   ============================================================ */

function formatNetLots(value) {
  if (!validNumber(value)) return "—";

  const n = Number(value);
  if (n > 0) return "買超 " + numberText(n, 1) + " 張";
  if (n < 0) return "賣超 " + numberText(Math.abs(n), 1) + " 張";
  return "0 張";
}

function renderInstitutionalDetailCard(title, metric) {
  const days = validNumber(metric.consecutive_days)
    ? Math.abs(Number(metric.consecutive_days)) + " 日"
    : "—";

  return `
    <div class="institutional-card">
      <div class="institutional-card-title">${escapeHtml(title)}</div>

      <div class="institutional-card-row">
        <div class="institutional-card-label">當日</div>
        <div class="institutional-card-value ${getNetClass(metric)}">
          ${escapeHtml(getNetText(metric))}
        </div>
      </div>

      <div class="institutional-card-row">
        <div class="institutional-card-label">5日</div>
        <div class="institutional-card-value">
          ${escapeHtml(formatNetLots(metric.net_5d_lots))}
        </div>
      </div>

      <div class="institutional-card-row">
        <div class="institutional-card-label">20日</div>
        <div class="institutional-card-value">
          ${escapeHtml(formatNetLots(metric.net_20d_lots))}
        </div>
      </div>

      <div class="institutional-card-row">
        <div class="institutional-card-label">連續天數</div>
        <div class="institutional-card-value">${escapeHtml(days)}</div>
      </div>

      <div class="institutional-card-row">
        <div class="institutional-card-label">方向</div>
        <div class="institutional-card-value">
          ${escapeHtml(metric.trend || "資料不足")}
        </div>
      </div>
    </div>
  `;
}

function renderInstitutionalDetails(s) {
  const institutional = getInstitutional(s);

  return `
    <div class="detail-section">
      <div class="detail-section-title">三大法人買賣超</div>

      <div class="institutional-summary">
        <div class="institutional-date">
          資料日期：${escapeHtml(institutional.latest_date || "—")}
        </div>
        <div class="institutional-summary-text">
          ${escapeHtml(institutional.summary || "資料不足")}
        </div>
      </div>

      <div class="institutional-grid">
        ${renderInstitutionalDetailCard("外資", getInstitutionMetric(s, "foreign"))}
        ${renderInstitutionalDetailCard("投信", getInstitutionMetric(s, "trust"))}
        ${renderInstitutionalDetailCard("自營商", getInstitutionMetric(s, "dealer"))}
      </div>
    </div>
  `;
}

/* ============================================================
   資料缺漏提示
   ============================================================ */

function normalizeMissingItems(s) {
  const map = {
    revenue: "營收",
    foreign_holding: "外資持股",
    institutional: "三大法人買賣超",
    technical: "技術面"
  };

  const result = [];

  if (Array.isArray(s.missing_items)) {
    s.missing_items.forEach(item => result.push(map[item] || item));
  }

  if (
    s.data_quality &&
    Array.isArray(s.data_quality.missing_items)
  ) {
    s.data_quality.missing_items.forEach(
      item => result.push(map[item] || item)
    );
  }

  return [...new Set(result)];
}

/* ============================================================
   評分明細
   基本面 40、籌碼面 20、技術面 40
   籌碼面使用新版 analyzer.py 的 chip_score
   不再使用 foreign_holding.score 代替
   ============================================================ */

function renderScoreBreakdown(s) {
  const revenue = s.revenue || {};
  const technical = s.technical || {};
  const breakdown = s.score_breakdown || {};

  const fundamentalScore =
    validNumber(breakdown.fundamental)
      ? breakdown.fundamental
      : revenue.score;

  const chipScore =
    validNumber(breakdown.chip)
      ? breakdown.chip
      : s.chip_score;

  const technicalScore =
    validNumber(breakdown.technical)
      ? breakdown.technical
      : technical.score;

  const items = [
    { name: "基本面", score: fundamentalScore, max: 40 },
    { name: "籌碼面（三大法人）", score: chipScore, max: 20 },
    { name: "技術面", score: technicalScore, max: 40 }
  ];

  return `
    <div class="score-breakdown">
      <div class="score-breakdown-title">評分明細</div>

      ${items.map(item => {
        const hasScore = validNumber(item.score);
        const score = hasScore ? Number(item.score) : 0;
        const percent = hasScore
          ? Math.max(0, Math.min(100, score / item.max * 100))
          : 0;

        const color = percent >= 70
          ? "var(--green)"
          : percent >= 50
            ? "var(--yellow)"
            : "var(--red)";

        return `
          <div class="score-row">
            <div>${escapeHtml(item.name)}</div>
            <div class="score-bar">
              <div class="score-fill"
                   style="width:${percent}%;background:${hasScore ? color : "transparent"}">
              </div>
            </div>
            <div class="score-number">
              ${hasScore
                ? `${numberText(score, 1)} / ${item.max}`
                : "資料不足"}
            </div>
          </div>
        `;
      }).join("")}
    </div>
  `;
}

/* ============================================================
   技術分析
   ============================================================ */

function renderTechnical(s) {
  const technical = s.technical || {};
  const ma = technical.ma || {};
  const rsi = technical.rsi || {};
  const macd = technical.macd || {};
  const kdj = technical.kdj || {};

  const rsiValue = validNumber(rsi.value)
    ? rsi.value
    : validNumber(technical.rsi)
      ? technical.rsi
      : null;

  return `
    <div class="technical-summary">
      <div class="technical-summary-item">
        <div class="technical-summary-label">技術訊號</div>
        <div class="technical-summary-value">
          ${escapeHtml(technical.signal || technical.message || "資料不足")}
        </div>
      </div>

      <div class="technical-summary-item">
        <div class="technical-summary-label">RSI</div>
        <div class="technical-summary-value">
          ${rsiValue !== null ? numberText(rsiValue, 2) : "—"}
        </div>
      </div>

      <div class="technical-summary-item">
        <div class="technical-summary-label">MACD</div>
        <div class="technical-summary-value">
          ${escapeHtml(macd.signal || technical.macd_signal || "—")}
        </div>
      </div>

      <div class="technical-summary-item">
        <div class="technical-summary-label">均線</div>
        <div class="technical-summary-value">
          ${escapeHtml(ma.signal || technical.ma_signal || "—")}
        </div>
      </div>
    </div>

    <button class="technical-toggle" onclick="toggleTechnical(this)">
      展開技術分析詳細資料
    </button>

    <div class="technical-details">
      <div class="detail-section">
        <div class="detail-section-title">技術指標</div>

        <div class="detail-row">
          <div class="detail-label">MA5</div>
          <div class="detail-value">${numberText(ma.ma5)}</div>
        </div>

        <div class="detail-row">
          <div class="detail-label">MA20</div>
          <div class="detail-value">${numberText(ma.ma20)}</div>
        </div>

        <div class="detail-row">
          <div class="detail-label">MA60</div>
          <div class="detail-value">${numberText(ma.ma60)}</div>
        </div>

        <div class="detail-row">
          <div class="detail-label">RSI</div>
          <div class="detail-value">
            ${rsiValue !== null ? numberText(rsiValue, 2) : "—"}
          </div>
        </div>

        <div class="detail-row">
          <div class="detail-label">MACD</div>
          <div class="detail-value">
            ${escapeHtml(macd.signal || technical.macd_signal || "—")}
          </div>
        </div>

        <div class="detail-row">
          <div class="detail-label">KDJ</div>
          <div class="detail-value">
            ${escapeHtml(kdj.signal || technical.kdj_signal || "—")}
          </div>
        </div>
      </div>
    </div>
  `;
}

function toggleTechnical(button) {
  const details = button.nextElementSibling;
  if (!details) return;

  details.classList.toggle("open");
  button.textContent = details.classList.contains("open")
    ? "收合技術分析詳細資料"
    : "展開技術分析詳細資料";
}

/* ============================================================
   詳細資料
   ============================================================ */

function renderDetails(s) {
  const revenue = s.revenue || {};
  const foreign = s.foreign_holding || {};
  const technical = s.technical || {};
  const quality = s.data_quality || {};

  const revenueYoy = validNumber(revenue.latest_yoy)
    ? revenue.latest_yoy
    : validNumber(revenue.yoy)
      ? revenue.yoy
      : null;

  return `
    <div class="detail-section">
      <div class="detail-section-title">營收</div>

      <div class="detail-row">
        <div class="detail-label">最新營收年增率</div>
        <div class="detail-value">
          ${revenueYoy !== null ? numberText(revenueYoy, 2) + "%" : "—"}
        </div>
      </div>

      <div class="detail-row">
        <div class="detail-label">營收評分</div>
        <div class="detail-value">
          ${validNumber(revenue.score)
            ? `${numberText(revenue.score, 1)} / 40`
            : "—"}
        </div>
      </div>

      <div class="detail-row">
        <div class="detail-label">訊息</div>
        <div class="detail-value">${escapeHtml(revenue.message || "—")}</div>
      </div>
    </div>

    <div class="detail-section">
      <div class="detail-section-title">外資持股（趨勢參考）</div>

      <div class="detail-row">
        <div class="detail-label">持股比例</div>
        <div class="detail-value">
          ${validNumber(foreign.latest_percent)
            ? numberText(foreign.latest_percent, 2) + "%"
            : "—"}
        </div>
      </div>

      <div class="detail-row">
        <div class="detail-label">趨勢</div>
        <div class="detail-value">${escapeHtml(foreign.trend || "—")}</div>
      </div>

      <div class="detail-row">
        <div class="detail-label">外資持股參考分（不計入總分）</div>
        <div class="detail-value">
          ${validNumber(foreign.score)
            ? `${numberText(foreign.score, 1)} / 20`
            : "—"}
        </div>
      </div>
    </div>

    ${renderInstitutionalDetails(s)}

    <div class="detail-section">
      <div class="detail-section-title">技術面</div>

      <div class="detail-row">
        <div class="detail-label">技術評分</div>
        <div class="detail-value">
          ${validNumber(technical.score)
            ? `${numberText(technical.score, 1)} / 40`
            : "—"}
        </div>
      </div>

      <div class="detail-row">
        <div class="detail-label">訊息</div>
        <div class="detail-value">
          ${escapeHtml(technical.message || technical.signal || "—")}
        </div>
      </div>
    </div>

    <div class="detail-section">
      <div class="detail-section-title">資料完整性</div>

      <div class="detail-row">
        <div class="detail-label">狀態</div>
        <div class="detail-value">${escapeHtml(s.status || "—")}</div>
      </div>

      <div class="detail-row">
        <div class="detail-label">資料完整</div>
        <div class="detail-value">
          ${quality.complete === true
            ? "是"
            : quality.complete === false
              ? "否"
              : "—"}
        </div>
      </div>
    </div>
  `;
}

function toggleDetails(button) {
  const details = button.nextElementSibling;
  if (!details) return;

  details.classList.toggle("open");
  button.textContent = details.classList.contains("open")
    ? "收合詳細資料"
    : "查看詳細資料";
}

/* ============================================================
   股票卡片
   ============================================================ */

function renderStockCard(s) {
  const stockId = getStockId(s);
  const stockName = getStockName(stockId, s);
  const revenue = s.revenue || {};
  const foreign = s.foreign_holding || {};
  const totalScore = s.score;
  const missingItems = normalizeMissingItems(s);

  const revenueYoy = validNumber(revenue.latest_yoy)
    ? revenue.latest_yoy
    : validNumber(revenue.yoy)
      ? revenue.yoy
      : null;

  return `
    <div class="stock-card">
      <div class="stock-header">
        <div class="stock-title">
          <div class="stock-code">${escapeHtml(stockId)}</div>
          <div class="stock-name">${escapeHtml(stockName)}</div>
        </div>

        <div class="score-box">
          <div class="score ${scoreClass(totalScore)}">
            ${validNumber(totalScore) ? numberText(totalScore, 1) : "—"}
          </div>
          <div class="score-label">總分 / 100</div>
        </div>
      </div>

      <div class="metrics">
        <div class="metric">
          <div class="metric-label">最新營收年增率</div>
          <div class="metric-value">
            ${revenueYoy !== null ? numberText(revenueYoy, 2) + "%" : "—"}
          </div>
        </div>

        <div class="metric">
          <div class="metric-label">外資持股比例</div>
          <div class="metric-value">
            ${validNumber(foreign.latest_percent)
              ? numberText(foreign.latest_percent, 2) + "%"
              : "—"}
          </div>
        </div>
      </div>

      ${renderInstitutionalSummary(s)}
      ${renderScoreBreakdown(s)}
      ${renderTechnical(s)}

      ${
        missingItems.length
          ? `<div class="quality-warning">
              資料不足：${escapeHtml(missingItems.join("、"))}
            </div>`
          : ""
      }

      ${
        s.status === "error"
          ? `<div class="quality-warning error">此股票分析發生錯誤。</div>`
          : ""
      }

      <button class="detail-toggle" onclick="toggleDetails(this)">
        查看詳細資料
      </button>

      <div class="details">
        ${renderDetails(s)}
      </div>
    </div>
  `;
}

/* ============================================================
   Render：全部／觀察清單
   ============================================================ */

function render() {
  const list = document.getElementById("stockList");
  let data = [...analysisData];

  if (currentMode === "watch") {
    data = data.filter(item => watchlist.includes(getStockId(item)));
  }

  if (data.length === 0) {
    list.innerHTML = `
      <div class="empty">
        ${currentMode === "watch"
          ? "觀察清單目前沒有符合的股票，請先到觀察清單管理頁新增股票。"
          : "沒有符合條件的股票"}
      </div>
    `;
    return;
  }

  list.innerHTML = data.map(renderStockCard).join("");
}

/* ============================================================
   analysis.json
   ============================================================ */

async function loadAnalysis() {
  const status = document.getElementById("status");
  const refreshButton = document.getElementById("btnRefresh");

  refreshButton.disabled = true;
  status.textContent = "正在載入分析資料...";

  try {
    const response = await fetch(
      "./analysis.json?t=" + Date.now(),
      { cache: "no-store" }
    );

    if (!response.ok) {
      throw new Error("analysis.json HTTP " + response.status);
    }

    const data = await response.json();

    if (Array.isArray(data)) {
      analysisData = data;
    } else if (data && Array.isArray(data.stocks)) {
      analysisData = data.stocks;
    } else if (data && data.data && Array.isArray(data.data.stocks)) {
      analysisData = data.data.stocks;
    } else {
      analysisData = [];
    }

    const updateTime =
      data.update_time ||
      data.updated_at ||
      data.data?.update_time ||
      "";

    status.textContent =
      "股票數：" + analysisData.length +
      (updateTime ? "　｜　更新時間：" + updateTime : "") +
      "　｜　名稱對照：" + Object.keys(stockNames).length + " 筆";

    render();
  } catch (error) {
    console.error("analysis.json 載入失敗：", error);

    status.innerHTML =
      '<span class="error">analysis.json 載入失敗：' +
      escapeHtml(error.message) +
      "</span>";

    document.getElementById("stockList").innerHTML = `
      <div class="empty">無法取得分析資料，請確認 analysis.json 是否存在。</div>
    `;
  } finally {
    refreshButton.disabled = false;
  }
}

/* ============================================================
   觀察清單
   保留原有 localStorage key：watchlist
   ============================================================ */

function loadWatchlist() {
  try {
    const raw = localStorage.getItem("watchlist");

    if (!raw) {
      watchlist = [];
      return;
    }

    const data = JSON.parse(raw);

    if (Array.isArray(data)) {
      watchlist = [
        ...new Set(
          data.map(item => {
            if (item && typeof item === "object") {
              return String(
                item.stock_id ??
                item.stock_code ??
                item.code ??
                ""
              ).trim();
            }
            return String(item ?? "").trim();
          }).filter(Boolean)
        )
      ];
    } else {
      watchlist = [];
    }
  } catch (error) {
    console.warn("讀取 watchlist 失敗：", error);
    watchlist = [];
  }
}

/* ============================================================
   按鈕事件
   ============================================================ */

document.getElementById("btnAll").addEventListener("click", function() {
  currentMode = "all";
  this.classList.add("active");
  document.getElementById("btnWatch").classList.remove("active");
  render();
});

document.getElementById("btnWatch").addEventListener("click", function() {
  currentMode = "watch";
  this.classList.add("active");
  document.getElementById("btnAll").classList.remove("active");
  loadWatchlist();
  render();
});

document.getElementById("btnRefresh").addEventListener("click", async function() {
  loadWatchlist();
  await loadStockNames();
  await loadAnalysis();
});

/* ============================================================
   啟動
   先載入股票名稱，再載入分析資料
   ============================================================ */

async function init() {
  loadWatchlist();
  await loadStockNames();
  await loadAnalysis();
}

init();
</script>
