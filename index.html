<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>台股分析儀表板</title>

  <link rel="stylesheet" href="./css/style.css">
</head>

<body>
  <div class="container">

    <header class="header">
      <div class="header-title">
        <h1>台股分析儀表板</h1>
        <p>每日收盤資料與個股分析</p>
      </div>

      <div class="header-actions">
        <button id="refreshBtn" type="button">
          重新整理
        </button>

        <a href="./watchlist.html" class="watchlist-link">
          自選股管理
        </a>
      </div>
    </header>

    <section class="toolbar">
      <div class="search-box">
        <input
          type="search"
          id="searchInput"
          placeholder="搜尋股票代號或名稱"
          autocomplete="off"
        >
      </div>

      <div class="sort-box">
        <select id="sortSelect">
          <option value="code">依代號排序</option>
          <option value="name">依名稱排序</option>
          <option value="scoreDesc">評分由高至低</option>
          <option value="scoreAsc">評分由低至高</option>
        </select>
      </div>
    </section>

    <div id="message" class="message">
      正在載入資料...
    </div>

    <main>
      <div id="stockGrid" class="stock-grid"></div>
    </main>

    <footer class="footer">
      <p>
        本儀表板資料僅供個人研究參考，不構成任何投資建議。
      </p>
    </footer>

  </div>

  <!-- 共用設定與工具 -->
  <script src="./js/common.js"></script>

  <!-- 股票資料 -->
  <script src="./js/data.js"></script>

  <!-- 評分與分析 -->
  <script src="./js/score.js"></script>
  <script src="./js/institutional.js"></script>
  <script src="./js/technical.js"></script>
  <script src="./js/valuation.js"></script>
  <script src="./js/stock-price.js"></script>
  <script src="./js/market-index.js"></script>
  <script src="./js/details.js"></script>
  <script src="./js/event.js"></script>

  <!-- 突破策略 -->
  <script src="./js/breakout-data.js"></script>
  <script src="./js/breakout-format.js"></script>
  <script src="./js/breakout-history.js"></script>
  <script src="./js/breakout-panel.js"></script>

  <!-- 首頁股票卡片 -->
  <script src="./js/stock-card.js"></script>

  <!-- 資料載入與更新 -->
  <script src="./js/dashboard-loader.js"></script>

  <!-- 首頁初始化與事件綁定 -->
  <script src="./js/dashboard-init.js"></script>

</body>
</html>
