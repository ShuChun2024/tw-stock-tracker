<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1120">
  <meta name="color-scheme" content="dark">
  <title>台股分析儀表板</title>

  <style>
    :root {
      --bg: #0b1120;
      --card: #151f32;
      --text: #e5edf8;
      --muted: #9aaac0;
      --border: #2c3b52;
      --blue: #38bdf8;
      --green: #4ade80;
      --red: #f87171;
      --yellow: #fbbf24;
      --gray: #a5b4c8;
      --metric-bg: #1c2940;
      --button-bg: #1e3a5f;
      --button-border: #315780;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Microsoft JhengHei", Arial, sans-serif;
      line-height: 1.6;
      min-height: 100vh;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 20px;
      padding: 22px;
      background: linear-gradient(135deg, #172842, #111a2b);
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 26px;
      color: #f8fafc;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 18px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 14px;
    }

    .panel {
      margin: 16px 0;
      padding: 18px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 0;
    }

    .field label {
      color: var(--muted);
      font-size: 13px;
    }

    input, select, button {
      min-height: 42px;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
    }

    input, select {
      width: 100%;
      min-width: 0;
      background: #101a2b;
      color: var(--text);
      color-scheme: dark;
    }

    input::placeholder { color: #74849a; }

    button {
      border: 1px solid transparent;
      background: #1769aa;
      color: #fff;
      cursor: pointer;
      transition: background .2s ease;
    }

    button:hover:not(:disabled) { background: #2584ca; }

    button:focus-visible, select:focus-visible, input:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .primary-button {
      width: 100%;
      margin-top: 12px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(180px, .7fr) auto;
      gap: 10px;
      align-items: center;
      margin: 18px 0;
    }

    .secondary-button {
      background: var(--button-bg);
      color: #7dd3fc;
      border-color: var(--button-border);
    }

    .secondary-button:hover:not(:disabled) {
      background: #294d75;
    }

    .danger-button {
      background: #562b37;
      border-color: #854253;
      color: #fecaca;
    }

    .danger-button:hover:not(:disabled) {
      background: #783747;
    }

    .small-button {
      min-height: 34px;
      padding: 5px 9px;
      font-size: 13px;
    }

    #message {
      margin: 12px 0 18px;
      padding: 12px 14px;
      color: var(--muted);
      background: #111a2b;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .stock-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(270px, 1fr));
      gap: 16px;
    }

    .stock-card {
      min-width: 0;
      padding: 18px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 5px 18px rgba(0, 0, 0, .18);
      transition: border-color .2s ease;
    }

    .stock-card:hover { border-color: #405875; }

    .stock-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 14px;
    }

    .stock-id {
      font-size: 23px;
      font-weight: 700;
      color: #f8fafc;
      letter-spacing: .5px;
    }

    .stock-name {
      margin-top: 2px;
      font-size: 17px;
      font-weight: 650;
      overflow-wrap: anywhere;
    }

    .company-name {
      margin-top: 3px;
      color: var(--muted);
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .status {
      display: inline-block;
      padding: 4px 9px;
      border-radius: 20px;
      background: #263449;
      color: #d5dfed;
      font-size: 12px;
      white-space: nowrap;
    }

    .status-good { color: var(--green); }
    .status-pending { color: var(--yellow); }

    .score-area {
      display: flex;
      align-items: baseline;
      gap: 5px;
      margin-bottom: 14px;
    }

    .score {
      font-size: 32px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .score-label {
      color: var(--muted);
      font-size: 13px;
    }

    .metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .metric {
      min-width: 0;
      padding: 11px;
      background: var(--metric-bg);
      border: 1px solid rgba(70, 95, 125, .28);
      border-radius: 8px;
    }

    .metric-label {
      color: var(--muted);
      font-size: 12px;
    }

    .metric-value {
      margin-top: 4px;
      font-size: 16px;
      font-weight: 650;
      overflow-wrap: anywhere;
    }

    /* 台股配色：紅漲、綠跌 */
    .positive { color: var(--red); }
    .negative { color: var(--green); }
    .neutral { color: var(--text); }

    .detail-button {
      width: 100%;
      margin-top: 14px;
      background: var(--button-bg);
      color: #7dd3fc;
      border: 1px solid var(--button-border);
    }

    .detail-button:hover:not(:disabled) { background: #294d75; }

    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .card-actions button { flex: 1; }

    .details {
      display: none;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .details.open { display: block; }

    .details p {
      margin: 8px 0;
      color: #d5dfed;
    }

    .details strong { color: #f1f5f9; }

    .quality {
      margin-top: 12px;
      padding: 12px;
      border-radius: 8px;
      background: var(--metric-bg);
      border: 1px solid var(--border);
    }

    .quality-title {
      font-weight: 700;
      margin-bottom: 5px;
      color: #f8fafc;
    }

    .quality-good { color: var(--green); font-weight: 650; }
    .quality-warning { color: var(--yellow); font-weight: 650; }
    .quality-unknown { color: var(--gray); font-weight: 650; }

    .pending-note {
      margin-top: 10px;
      padding: 10px;
      border: 1px solid #65552b;
      border-radius: 8px;
      background: #302a1b;
      color: #fbbf24;
      font-size: 13px;
    }

    .empty-state {
      grid-column: 1 / -1;
      padding: 28px 16px;
      color: var(--muted);
      text-align: center;
      border: 1px dashed var(--border);
      border-radius: 12px;
    }

    .footer {
      margin: 24px 0 12px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 650px) {
      body { padding: 12px; }
      header { padding: 16px; }
      h1 { font-size: 22px; }

      .form-grid { grid-template-columns: minmax(0, 1fr); }

      .toolbar {
        grid-template-columns: minmax(0, 1fr);
      }

      .stock-grid { grid-template-columns: minmax(0, 1fr); }
      .stock-card { padding: 14px; }
      .stock-id { font-size: 21px; }
      .score { font-size: 30px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>

<body>
<main class="container">
  <header>
    <h1>台股分析儀表板</h1>
    <div class="subtitle">營收趨勢、外資持股與綜合評分</div>
  </header>

  <section class="panel" aria-labelledby="manageTitle">
    <h2 id="manageTitle">觀測股票管理</h2>
    <div class="subtitle">
      本清單只儲存在目前瀏覽器，不會直接修改 GitHub 的 config.json。
    </div>

    <form id="addStockForm">
      <div class="form-grid">
        <div class="field">
          <label for="stockCodeInput">股票代碼（必填）</label>
          <input
            id="stockCodeInput"
            name="stockCode"
            inputmode="numeric"
            autocomplete="off"
            maxlength="6"
            placeholder="例如：2330"
            required
          >
        </div>

        <div class="field">
          <label for="shortNameInput">中文簡稱（可留空）</label>
          <input
            id="shortNameInput"
            name="shortName"
            maxlength="40"
            autocomplete="off"
            placeholder="例如：台積電"
          >
        </div>

        <div class="field">
          <label for="companyNameInput">公司全名（可留空）</label>
          <input
            id="companyNameInput"
            name="companyName"
            maxlength="100"
            autocomplete="off"
            placeholder="例如：台灣積體電路製造股份有限公司"
          >
        </div>
      </div>

      <button id="addStockButton" class="primary-button" type="submit">
        新增觀測股票
      </button>
    </form>
  </section>

  <section class="toolbar" aria-label="股票搜尋及排序">
    <input
      id="searchInput"
      type="search"
      placeholder="搜尋代碼、中文簡稱或公司名稱"
      aria-label="搜尋股票"
    >

    <select id="sortSelect" aria-label="排序方式">
      <option value="score-desc">綜合評分：高至低</option>
      <option value="score-asc">綜合評分：低至高</option>
      <option value="stock-id">股票代碼：小至大</option>
      <option value="name-asc">中文名稱：升冪</option>
    </select>

    <button id="reloadButton" type="button">重新載入分析</button>
  </section>

  <div id="message" role="status" aria-live="polite">
    正在載入分析資料……
  </div>

  <section
    id="stockGrid"
    class="stock-grid"
    aria-label="股票分析結果"
  ></section>

  <footer class="footer">
    本頁分析結果僅供資訊參考，不構成投資建議。
  </footer>
</main>

<script>
"use strict";

// ============================================================
// 1. 常數與初始資料
// ============================================================

const STORAGE_KEY = "twStockAnalysisWatchlist_v1";

const DEFAULT_STOCKS = [
  {
    stock_id: "2330",
    short_name: "台積電",
    company_name: "台灣積體電路製造股份有限公司",
    name_confirmed: true
  },
  {
    stock_id: "2454",
    short_name: "聯發科",
    company_name: "聯發科技股份有限公司",
    name_confirmed: true
  },
  {
    stock_id: "2317",
    short_name: "鴻海",
    company_name: "鴻海精密工業股份有限公司",
    name_confirmed: true
  },
  {
    stock_id: "2603",
    short_name: "長榮",
    company_name: "長榮海運股份有限公司",
    name_confirmed: true
  }
];

const stockGrid = document.getElementById("stockGrid");
const message = document.getElementById("message");
const sortSelect = document.getElementById("sortSelect");
const searchInput = document.getElementById("searchInput");
const reloadButton = document.getElementById("reloadButton");
const addStockForm = document.getElementById("addStockForm");
const stockCodeInput = document.getElementById("stockCodeInput");
const shortNameInput = document.getElementById("shortNameInput");
const companyNameInput = document.getElementById("companyNameInput");
const addStockButton = document.getElementById("addStockButton");

let watchlist = [];
let analysisMap = new Map();
let analysisDate = "";
let analysisUpdateTime = "";
let analysisLoadError = "";

// ============================================================
// 2. 通用工具
// ============================================================

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, function(char) {
    return {
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    }[char];
  });
}

function formatNumber(value, digits = 2) {
  if (
    value === null ||
    value === undefined ||
    value === "" ||
    !Number.isFinite(Number(value))
  ) {
    return "資料不足";
  }

  return Number(value).toLocaleString("zh-TW", {
    maximumFractionDigits: digits,
    minimumFractionDigits: 0
  });
}

function formatPercent(value) {
  if (
    value === null ||
    value === undefined ||
    value === "" ||
    !Number.isFinite(Number(value))
  ) {
    return "資料不足";
  }

  return formatNumber(value, 2) + "%";
}

function formatRevenue(value) {
  if (
    value === null ||
    value === undefined ||
    value === "" ||
    !Number.isFinite(Number(value))
  ) {
    return "資料不足";
  }

  return formatNumber(Number(value) / 100000000, 2) + " 億";
}

function formatDate(value) {
  return value ? String(value) : "未提供";
}

function formatScore(value) {
  if (
    value === null ||
    value === undefined ||
    value === "" ||
    !Number.isFinite(Number(value))
  ) {
    return "—";
  }

  return formatNumber(value, 1);
}

function scoreClass(value) {
  if (
    value === null ||
    value === undefined ||
    value === "" ||
    !Number.isFinite(Number(value))
  ) {
    return "neutral";
  }

  const score = Number(value);

  if (score >= 70) return "positive";
  if (score < 40) return "negative";
  return "neutral";
}

function percentClass(value) {
  if (
    value === null ||
    value === undefined ||
    value === "" ||
    !Number.isFinite(Number(value))
  ) {
    return "neutral";
  }

  if (Number(value) > 0) return "positive";
  if (Number(value) < 0) return "negative";
  return "neutral";
}

function normalizeStockCode(value) {
  return String(value ?? "").trim();
}

function isValidStockCode(value) {
  // 接受 4 至 6 位數字代碼。
  // 這只檢查格式，不代表交易所已確認該股票存在。
  return /^\d{4,6}$/.test(value);
}

function getDisplayName(stock) {
  return stock.short_name || "名稱待確認";
}

function isNameConfirmed(stock) {
  return Boolean(stock.short_name && stock.name_confirmed);
}

// ============================================================
// 3. localStorage 觀測清單
// ============================================================

function normalizeWatchlistItem(item) {
  if (!item || typeof item !== "object") return null;

  const stockId = normalizeStockCode(item.stock_id);

  if (!isValidStockCode(stockId)) return null;

  return {
    stock_id: stockId,
    short_name: String(item.short_name || "").trim(),
    company_name: String(item.company_name || "").trim(),
    name_confirmed: Boolean(item.name_confirmed)
  };
}

function loadWatchlist() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);

    if (raw === null) {
      watchlist = DEFAULT_STOCKS.map(item => ({ ...item }));
      saveWatchlist();
      return;
    }

    const parsed = JSON.parse(raw);

    if (!Array.isArray(parsed)) {
      throw new Error("觀測清單格式錯誤");
    }

    const seen = new Set();
    watchlist = [];

    for (const item of parsed) {
      const normalized = normalizeWatchlistItem(item);

      if (!normalized || seen.has(normalized.stock_id)) continue;

      seen.add(normalized.stock_id);
      watchlist.push(normalized);
    }
  } catch (error) {
    console.error("讀取觀測清單失敗：", error);

    watchlist = DEFAULT_STOCKS.map(item => ({ ...item }));

    message.textContent =
      "無法讀取原有觀測清單，已載入預設清單。若瀏覽器禁止使用 localStorage，重新整理後可能無法保存變更。";
  }
}

function saveWatchlist() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(watchlist));
    return true;
  } catch (error) {
    console.error("保存觀測清單失敗：", error);

    alert(
      "無法保存觀測清單。請確認瀏覽器允許使用 localStorage，且儲存空間未滿。"
    );

    return false;
  }
}

// ============================================================
// 4. 股票中文名稱查詢
// ============================================================

function pickValue(row, keys) {
  for (const key of keys) {
    if (
      row &&
      row[key] !== null &&
      row[key] !== undefined &&
      String(row[key]).trim() !== ""
    ) {
      return String(row[key]).trim();
    }
  }

  return "";
}

function normalizeNameResult(row, stockId) {
  const code = pickValue(row, [
    "公司代號",
    "Code",
    "SecuritiesCompanyCode",
    "股票代號",
    "公司代碼",
    "公司代號 "
  ]);

  if (code !== stockId) return null;

  const shortName = pickValue(row, [
    "公司簡稱",
    "Name",
    "SecuritiesCompanyName",
    "公司名稱簡稱",
    "股票名稱",
    "證券名稱",
    "CompanyName"
  ]);

  const companyName = pickValue(row, [
    "公司名稱",
    "CompanyName",
    "公司全名",
    "公司名稱 "
  ]);

  if (!shortName && !companyName) return null;

  return {
    stock_id: stockId,
    short_name: shortName || companyName,
    company_name: companyName || shortName,
    name_confirmed: true
  };
}

async function fetchJSON(url) {
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 7000);

  try {
    const response = await fetch(url, {
      method: "GET",
      cache: "no-store",
      signal: controller.signal
    });

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    return await response.json();
  } finally {
    clearTimeout(timeoutId);
  }
}

async function lookupStockName(stockId) {
  // 第一順位：已知預設股票名稱。
  const known = DEFAULT_STOCKS.find(item => item.stock_id === stockId);

  if (known) return { ...known };

  // 第二順位：證交所公開資料。
  const twseEndpoints = [
    "https://openapi.twse.com.tw/v1/opendata/t187ap03_L",
    "https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL"
  ];

  for (const url of twseEndpoints) {
    try {
      const rows = await fetchJSON(url);

      if (!Array.isArray(rows)) continue;

      for (const row of rows) {
        const result = normalizeNameResult(row, stockId);
        if (result) return result;
      }
    } catch (error) {
      console.warn("證交所名稱查詢未成功：", url, error);
    }
  }

  // 第三順位：櫃買中心公開資料。
  // 不同公開資料集的欄位名稱可能不同，因此使用多組候選欄位。
  const tpexEndpoints = [
    "https://www.tpex.org.tw/openapi/v1/tpex_mainboard_daily_close_quotes",
    "https://www.tpex.org.tw/openapi/v1/mopsfin_t187ap03_O"
  ];

  for (const url of tpexEndpoints) {
    try {
      const rows = await fetchJSON(url);

      if (!Array.isArray(rows)) continue;

      for (const row of rows) {
        const result = normalizeNameResult(row, stockId);
        if (result) return result;
      }
    } catch (error) {
      console.warn("櫃買中心名稱查詢未成功：", url, error);
    }
  }

  return null;
}

// ============================================================
// 5. 新增、刪除及編輯股票
// ============================================================

addStockForm.addEventListener("submit", async function(event) {
  event.preventDefault();

  const stockId = normalizeStockCode(stockCodeInput.value);
  const manualShortName = shortNameInput.value.trim();
  const manualCompanyName = companyNameInput.value.trim();

  if (!stockId) {
    alert("請輸入股票代碼。");
    stockCodeInput.focus();
    return;
  }

  if (!isValidStockCode(stockId)) {
    alert("股票代碼格式不正確，請輸入 4 至 6 位數字。");
    stockCodeInput.focus();
    return;
  }

  if (watchlist.some(item => item.stock_id === stockId)) {
    alert("股票 " + stockId + " 已經在觀測清單中，請勿重複新增。");
    return;
  }

  addStockButton.disabled = true;
  addStockButton.textContent = "正在確認股票名稱……";

  let nameInfo = null;

  try {
    if (manualShortName || manualCompanyName) {
      nameInfo = {
        stock_id: stockId,
        short_name: manualShortName || manualCompanyName,
        company_name: manualCompanyName || manualShortName,
        name_confirmed: true
      };
    } else {
      nameInfo = await lookupStockName(stockId);
    }

    if (!nameInfo) {
      nameInfo = {
        stock_id: stockId,
        short_name: "",
        company_name: "",
        name_confirmed: false
      };
    }

    const newItem = {
      stock_id: stockId,
      short_name: nameInfo.short_name || "",
      company_name: nameInfo.company_name || "",
      name_confirmed: Boolean(nameInfo.name_confirmed)
    };

    watchlist.push(newItem);

    if (!saveWatchlist()) {
      watchlist = watchlist.filter(item => item.stock_id !== stockId);
      return;
    }

    stockCodeInput.value = "";
    shortNameInput.value = "";
    companyNameInput.value = "";

    renderStocks();

    if (!newItem.short_name) {
      alert(
        "股票已加入觀測清單，但未能取得中文名稱。\n" +
        "目前顯示「名稱待確認」，可使用卡片上的「編輯名稱」補充資料。"
      );
    }
  } finally {
    addStockButton.disabled = false;
    addStockButton.textContent = "新增觀測股票";
  }
});

function deleteStock(stockId) {
  const item = watchlist.find(stock => stock.stock_id === stockId);
  if (!item) return;

  if (!confirm(
    "確定要從目前瀏覽器的觀測清單刪除 " +
    stockId + "（" + getDisplayName(item) + "）嗎？"
  )) {
    return;
  }

  const previous = watchlist;
  watchlist = watchlist.filter(stock => stock.stock_id !== stockId);

  if (!saveWatchlist()) {
    watchlist = previous;
    return;
  }

  renderStocks();
}

async function editStockName(stockId) {
  const item = watchlist.find(stock => stock.stock_id === stockId);
  if (!item) return;

  const shortName = prompt(
    "請輸入股票中文簡稱：",
    item.short_name || ""
  );

  if (shortName === null) return;

  const companyName = prompt(
    "請輸入公司全名：",
    item.company_name || ""
  );

  if (companyName === null) return;

  const cleanedShortName = shortName.trim();
  const cleanedCompanyName = companyName.trim();

  if (!cleanedShortName && !cleanedCompanyName) {
    alert("中文簡稱及公司全名不能同時留白。");
    return;
  }

  const previous = { ...item };

  item.short_name = cleanedShortName || cleanedCompanyName;
  item.company_name = cleanedCompanyName || cleanedShortName;
  item.name_confirmed = true;

  if (!saveWatchlist()) {
    Object.assign(item, previous);
    return;
  }

  renderStocks();
}

// ============================================================
// 6. 分析資料與資料品質
// ============================================================

function dataQualityText(dataQuality) {
  if (dataQuality === null || dataQuality === undefined) {
    return {
      status: "狀態未提供",
      missingText: "未提供",
      className: "quality-unknown"
    };
  }

  if (typeof dataQuality === "string") {
    try {
      dataQuality = JSON.parse(dataQuality);
    } catch {
      return {
        status: dataQuality,
        missingText: "未提供",
        className: "quality-unknown"
      };
    }
  }

  if (typeof dataQuality !== "object" || Array.isArray(dataQuality)) {
    return {
      status: "狀態未提供",
      missingText: "未提供",
      className: "quality-unknown"
    };
  }

  const complete = dataQuality.complete;
  const missing = Array.isArray(dataQuality.missing_items)
    ? dataQuality.missing_items
    : [];

  const itemNames = {
    revenue: "營收資料",
    foreign_holding: "外資持股資料",
    score: "綜合評分",
    analysis_date: "分析日期",
    "營收": "營收資料",
    "外資持股": "外資持股資料"
  };

  const missingText = missing.length > 0
    ? missing.map(item => itemNames[item] || String(item)).join("、")
    : (complete === true ? "無" : "未提供");

  let status;
  let className;

  if (complete === true) {
    status = "資料完整";
    className = "quality-good";
  } else if (complete === false) {
    status = "資料不完整";
    className = "quality-warning";
  } else {
    status = "狀態未提供";
    className = "quality-unknown";
  }

  return { status, missingText, className };
}

// ============================================================
// 8. 搜尋、排序與畫面更新
// ============================================================

function getFilteredSortedWatchlist() {
  const keyword = searchInput.value.trim().toLocaleLowerCase("zh-TW");

  let list = watchlist.filter(stock => {
    if (!keyword) return true;

    return [
      stock.stock_id,
      stock.short_name,
      stock.company_name
    ].some(value =>
      String(value || "").toLocaleLowerCase("zh-TW").includes(keyword)
    );
  });

  const sortMode = sortSelect.value;

  if (sortMode === "stock-id") {
    list.sort((a, b) =>
      a.stock_id.localeCompare(b.stock_id, "zh-TW")
    );
  } else if (sortMode === "name-asc") {
    list.sort((a, b) =>
      getDisplayName(a).localeCompare(getDisplayName(b), "zh-TW")
    );
  } else if (sortMode === "score-asc" || sortMode === "score-desc") {
    list.sort((a, b) => {
      const analysisA = analysisMap.get(a.stock_id);
      const analysisB = analysisMap.get(b.stock_id);

      const scoreA = analysisA ? analysisA.score : null;
      const scoreB = analysisB ? analysisB.score : null;

      const validA = scoreA !== null &&
        scoreA !== undefined && Number.isFinite(Number(scoreA));

      const validB = scoreB !== null &&
        scoreB !== undefined && Number.isFinite(Number(scoreB));

      // 尚未分析及無有效評分的股票固定排在最後。
      if (!validA && !validB) {
        return a.stock_id.localeCompare(b.stock_id);
      }

      if (!validA) return 1;
      if (!validB) return -1;

      return sortMode === "score-desc"
        ? Number(scoreB) - Number(scoreA)
        : Number(scoreA) - Number(scoreB);
    });
  }

  return list;
}

function renderStocks() {
  const list = getFilteredSortedWatchlist();

  if (list.length === 0) {
    stockGrid.innerHTML = `
      <div class="empty-state">
        ${watchlist.length === 0
          ? "目前沒有觀測股票，請使用上方表單新增。"
          : "沒有符合搜尋條件的股票。"}
      </div>
    `;
  } else {
    stockGrid.innerHTML = list.map(stock => {
      const analysis = analysisMap.get(stock.stock_id);

      // 只有 analysis.json 中確實存在該代碼才顯示分析結果。
      if (!analysis) {
        return renderUnanalyzedStock(stock);
      }

      return renderAnalyzedStock(stock, analysis);
    }).join("");
  }

  const analyzedCount = watchlist.filter(stock =>
    analysisMap.has(stock.stock_id)
  ).length;

  const pendingCount = watchlist.length - analyzedCount;

  const updateText = analysisUpdateTime
    ? "｜資料更新：" + analysisUpdateTime
    : "";

  if (analysisLoadError) {
    message.textContent =
      "分析資料載入失敗：" + analysisLoadError +
      "。目前仍可管理本機觀測清單。";
  } else {
    message.textContent =
      `觀測 ${watchlist.length} 檔｜已取得分析結果 ${analyzedCount} 檔` +
      `｜尚未分析 ${pendingCount} 檔` +
      `｜分析日期：${analysisDate || "未提供"}` +
      updateText;
  }

  // 綁定卡片按鈕事件。
  stockGrid.querySelectorAll(".detail-button").forEach(button => {
    button.addEventListener("click", function() {
      const details = button.nextElementSibling;
      const isOpen = details.classList.toggle("open");

      button.textContent = isOpen
        ? "收合詳細資料"
        : "查看詳細資料";

      button.setAttribute("aria-expanded", String(isOpen));
    });
  });

  stockGrid.querySelectorAll('[data-action="delete"]').forEach(button => {
    button.addEventListener("click", function() {
      deleteStock(button.dataset.stockId);
    });
  });

  stockGrid.querySelectorAll('[data-action="edit"]').forEach(button => {
    button.addEventListener("click", function() {
      editStockName(button.dataset.stockId);
    });
  });
}

// ============================================================
// 9. 讀取 analysis.json
// ============================================================

async function loadAnalysis() {
  reloadButton.disabled = true;
  message.textContent = "正在載入最新分析資料……";
  analysisLoadError = "";

  try {
    const response = await fetch("./analysis.json?t=" + Date.now(), {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error("HTTP 狀態碼：" + response.status);
    }

    const data = await response.json();

    let resultStocks;

    if (Array.isArray(data)) {
      resultStocks = data;
      analysisDate = "";
      analysisUpdateTime = "";
    } else if (data && Array.isArray(data.stocks)) {
      resultStocks = data.stocks;
      analysisDate = data.analysis_date || "";
      analysisUpdateTime = data.update_time || "";
    } else {
      throw new Error("找不到股票資料陣列，請檢查 analysis.json 格式。");
    }

    const newMap = new Map();

    for (const item of resultStocks) {
      if (!item || item.stock_id === undefined || item.stock_id === null) {
        continue;
      }

      const stockId = normalizeStockCode(item.stock_id);

      if (!stockId) continue;

      newMap.set(stockId, item);
    }

    analysisMap = newMap;

    if (!analysisDate && resultStocks.length > 0) {
      analysisDate = resultStocks[0].analysis_date || "";
    }

    renderStocks();
  } catch (error) {
    console.error("載入 analysis.json 失敗：", error);
    analysisLoadError = error.message || String(error);

    // 保留既有觀測清單，不能因為讀取失敗就假裝股票沒有分析資料。
    stockGrid.innerHTML = `
      <div class="empty-state">
        無法取得最新分析資料。請確認 analysis.json 是否存在，
        並確認網站是透過 GitHub Pages 或本機 HTTP 伺服器開啟。
        <br><br>
        為避免誤導，暫時不顯示股票評分。
      </div>
    `;

    message.textContent =
      "無法載入 analysis.json：" + analysisLoadError;
  } finally {
    reloadButton.disabled = false;
  }
}

// ============================================================
// 10. 事件與初始化
// ============================================================

sortSelect.addEventListener("change", renderStocks);
searchInput.addEventListener("input", renderStocks);
reloadButton.addEventListener("click", loadAnalysis);

loadWatchlist();
loadAnalysis();
