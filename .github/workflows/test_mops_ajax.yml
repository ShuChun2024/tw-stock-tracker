name: Test MOPS AJAX

on:
  workflow_dispatch:

jobs:
  test-mops-ajax:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. 下載 Repository
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. 設定 Python
      # ============================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ============================================================
      # 3. 安裝測試程式需要的套件
      # ============================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      # ============================================================
      # 4. 執行 MOPS AJAX 測試
      # ============================================================
      - name: Run MOPS AJAX test
        run: |
          python test_mops_ajax.py
