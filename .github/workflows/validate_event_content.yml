name: 驗證事件內容與來源
on:
  workflow_dispatch:
  push:
    paths:
      - "events.json"
      - "twse_conference_v13_result.json"
      - "validate_event_content.py"
      - ".github/workflows/validate_event_content.yml"
permissions:
  contents: read
jobs:
  validate-event-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      - name: Check required files
        run: |
          if [ ! -f events.json ]; then
            echo "錯誤：找不到 events.json"
            exit 1
          fi
          if [ ! -f twse_conference_v13_result.json ]; then
            echo "錯誤：找不到 twse_conference_v13_result.json"
            exit 1
          fi
          if [ ! -f validate_event_content.py ]; then
            echo "錯誤：找不到 validate_event_content.py"
            exit 1
          fi
          echo "必要檔案檢查完成"
      - name: Validate event content
        run: |
          python validate_event_content.py
