name: Test Investor Conference

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-conference:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 python-docx pdfplumber

      - name: Run TWSE conference parser v11.2
        run: python test_conference.py

      - name: Show generated reports
        if: always()
        run: |
          echo "===== OUTPUT FILES ====="
          ls -lah twse_conference_v11_2_result.json \
            twse_conference_v11_2_sessions.txt 2>/dev/null || true

          echo "===== SESSION REPORT ====="
          if [ -f twse_conference_v11_2_sessions.txt ]; then
            tail -n 80 twse_conference_v11_2_sessions.txt
          fi

          echo "===== JSON SUMMARY ====="
          if [ -f twse_conference_v11_2_result.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path

          path = Path("twse_conference_v11_2_result.json")
          report = json.loads(path.read_text(encoding="utf-8"))

          print("版本：", report.get("version"))
          print("活動總數：", report.get("total_event_count"))
          print("符合活動：", report.get("conference_event_count"))
          print("已處理活動：", report.get("processed_event_count"))
          print("成功活動：", report.get("success_event_count"))
          print("下載附件活動：", report.get("downloaded_event_count"))
          print("場次總數：", report.get("total_session_count"))
          print("錯誤活動：", report.get("error_event_count"))
          print("資料品質：")
          print(json.dumps(
              report.get("session_quality", {}),
              ensure_ascii=False,
              indent=2
          ))

          if report.get("fatal_error"):
              print("重大錯誤：", report["fatal_error"])
          PY
          fi

      - name: Upload test reports and attachments
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conference-event-detail-v11-2
          path: |
            twse_conference_v11_2_result.json
            twse_conference_v11_2_sessions.txt
            twse_conference_v11_2_files/
          if-no-files-found: warn
          retention-days: 7
