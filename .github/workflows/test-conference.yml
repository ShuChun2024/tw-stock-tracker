name: Test Investor Conference

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-conference:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 python-docx pdfplumber

      - name: Run investor conference API test
        run: |
          python test_conference.py

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conference-event-list-v10
          path: |
            twse_conference_v10_result.json
            twse_conference_v10_sessions.txt
            twse_conference_v10_files/
          if-no-files-found: warn
          retention-days: 7
