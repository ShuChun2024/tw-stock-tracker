name: Test Investor Conference
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-conference:
    runs-on: ubuntu-latest
    steps:
      # 1. 下載 GitHub Repository
      - name: Checkout repository
        uses: actions/checkout@v4
      # 2. 設定 Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # 3. 安裝測試需要的套件
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4
      # 4. 執行法人說明會資料測試
      - name: Run investor conference test
        run: |
          python test_conference.py
      # 5. 保存測試結果
      - name: Upload test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conference-event-detail-v5
          path: |
            twse_conference_v4_result.json
            twse_conference_page_v4.html
          if-no-files-found: warn
          retention-days: 7
