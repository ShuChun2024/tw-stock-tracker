name: Test TWSE Investor Conference v13
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-conference:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pdfplumber python-docx
      - name: Run v13 conference parser
        run: python test_conference.py
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twse-conference-v13-results
          path: |
            twse_conference_v13_result.json
            twse_conference_v13_sessions.txt
            twse_conference_v13_files/
          if-no-files-found: warn
          retention-days: 7
