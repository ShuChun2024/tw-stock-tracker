name: Test Investor Conference

on:
  workflow_dispatch:

jobs:
  test-conference:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. 下載 Repository
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. 設定 Python
      # ============================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ============================================================
      # 3. 安裝套件
      # ============================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 python-docx pdfplumber

      # ============================================================
      # 4. 執行 v12 法人說明會測試
      # ============================================================
      - name: Run Investor Conference Test v12
        run: |
          python test_conference.py

      # ============================================================
      # 5. 顯示輸出檔案
      # ============================================================
      - name: Show generated files
        if: always()
        run: |
          echo "========================================"
          echo "Generated files"
          echo "========================================"

          echo ""
          echo "--- JSON ---"
          ls -lh twse_conference_v11_2_result.json || true

          echo ""
          echo "--- TXT ---"
          ls -lh twse_conference_v11_2_sessions.txt || true

          echo ""
          echo "--- Downloaded files ---"
          ls -lh twse_conference_v11_2_files/ || true

      # ============================================================
      # 6. 顯示 TXT 測試摘要
      # ============================================================
      - name: Show test summary
        if: always()
        run: |
          echo "========================================"
          echo "Test Summary"
          echo "========================================"

          if [ -f twse_conference_v11_2_sessions.txt ]; then
            echo ""
            echo "--- SUMMARY ---"

            sed -n '/===== SUMMARY =====/,$p' \
              twse_conference_v11_2_sessions.txt
          else
            echo "TXT report not found."
          fi

      # ============================================================
      # 7. 上傳測試結果
      # ============================================================
      - name: Upload conference test results v12
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conference-event-detail-v12
          path: |
            twse_conference_v11_2_result.json
            twse_conference_v11_2_sessions.txt
            twse_conference_v11_2_files/
          if-no-files-found: warn
          retention-days: 30
