name: Test Investor Conference v11.1
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-conference:
    runs-on: ubuntu-latest
    steps:
      # ============================================================
      # 1. 下載 GitHub Repository
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
      # ============================================================
      # 2. 設定 Python
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # ============================================================
      # 3. 安裝測試所需套件
      # ============================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          pip install beautifulsoup4
          pip install python-docx
          pip install pdfplumber
      # ============================================================
      # 4. 執行 v11.1 測試
      # ============================================================
      - name: Run investor conference test v11.1
        run: |
          python test_conference.py
      # ============================================================
      # 5. 上傳測試結果
      #    即使程式失敗，也保留已產生的檔案
      # ============================================================
      - name: Upload v11.1 test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conference-event-detail-v11-1
          path: |
            twse_conference_v11_1_result.json
            twse_conference_v11_1_sessions.txt
            twse_conference_v11_1_files/
          if-no-files-found: warn
          retention-days: 7
