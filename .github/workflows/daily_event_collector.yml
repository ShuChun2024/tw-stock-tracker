name: Daily Event Collector

on:
  schedule:
    # 台灣時間每天 18:40
    # GitHub Actions 使用 UTC
    - cron: "40 10 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-event-collector
  cancel-in-progress: false

jobs:
  collect-events:
    runs-on: ubuntu-latest

    steps:
      # ======================================================
      # 1. 取得 Repository
      # ======================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ======================================================
      # 2. 設定 Python
      # ======================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ======================================================
      # 3. 安裝依賴
      # ======================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # ======================================================
      # 4. 執行事件收集器
      # ======================================================
      - name: Run event collector
        run: |
          python event_collector.py

      # ======================================================
      # 5. Commit events.json
      # ======================================================
      - name: Commit events.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add events.json

          if git diff --cached --quiet; then
            echo "events.json 沒有變更"
          else
            git commit -m "chore: update events"
            git push
          fi
