name: Test Python Code

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "*.py"
      - "tests/**"
      - ".github/workflows/test_python.yml"

  pull_request:
    branches:
      - main
    paths:
      - "*.py"
      - "tests/**"
      - ".github/workflows/test_python.yml"

permissions:
  contents: read

concurrency:
  group: test-python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python Syntax and Tests
    runs-on: ubuntu-latest

    steps:
      # 1. 取得程式碼
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 設定 Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # 3. 安裝測試工具
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pandas FinMind

      # 4. 檢查主要程式語法
      - name: Compile Python files
        run: |
          python -m py_compile main.py
          python -m py_compile analyzer.py
          python -m py_compile breakout.py
          python -m py_compile technical.py

      # 5. 執行自動化測試
      - name: Run pytest
        run: |
          if [ -d "tests" ] && find tests -name "test_*.py" -print -quit | grep -q .; then
            python -m pytest tests -v
          else
            echo "No pytest test files found. Syntax check completed."
          fi
