name: Test Emerging Stock Market API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-esb:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Test Emerging Stock API
        run: |
          python test_esb.py

      - name: Check test output
        if: always()
        run: |
          echo "檢查測試輸出檔案"

          if [ -f esb_6750_response.txt ]; then
            echo "找到原始回應"
            ls -lh esb_6750_response.txt
          fi

          if [ -f esb_6750_test.json ]; then
            echo "找到測試結果"
            ls -lh esb_6750_test.json
          fi

      - name: Upload ESB diagnostic result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esb-6750-diagnostic
          path: |
            esb_6750_response.txt
            esb_6750_test.json
          if-no-files-found: warn
          retention-days: 7
