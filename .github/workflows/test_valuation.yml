name: Test Stock Valuation
on:
  workflow_dispatch:
  schedule:
    # 每天台灣時間 10:30 執行（UTC 02:30）
    - cron: "30 2 * * 1-5"
permissions:
  contents: read
jobs:
  test-valuation:
    runs-on: ubuntu-latest
    steps:
      # 1. 取得 GitHub Repository 程式碼
      - name: Checkout repository
        uses: actions/checkout@v4
      # 2. 設定 Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      # 3. 安裝測試所需套件
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests
      # 4. 執行估值資料測試
      - name: Run valuation test
        run: |
          python valuation.py
      # 5. 保存 CSV 測試結果
      - name: Upload valuation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twse-valuation-results
          path: twse_valuation_*.csv
          if-no-files-found: warn
          retention-days: 7
