name: 測試 MOPS 法人說明會爬蟲
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test-mops-briefing:
    runs-on: ubuntu-latest
    steps:
      # ============================================================
      # 1. 取得 repository
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
      # ============================================================
      # 2. 設定 Python
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      # ============================================================
      # 3. 安裝必要套件
      # ============================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4
      # ============================================================
      # 4. 執行 MOPS 法人說明會測試
      # ============================================================
      - name: Run MOPS briefing test
        run: |
          python mops_briefing.py
      # ============================================================
      # 5. 檢查輸出 JSON
      # ============================================================
      - name: Validate output JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("mops_briefing_2330_2025.json")
          if not path.exists():
              raise SystemExit(
                  f"找不到輸出檔案：{path}"
              )
          with path.open("r", encoding="utf-8") as f:
              data = json.load(f)
          if not isinstance(data, dict):
              raise SystemExit("JSON 格式錯誤")
          print("JSON 驗證成功")
          print(
              json.dumps(
                  data,
                  ensure_ascii=False,
                  indent=2
              )
          )
          briefings = data.get("briefings")
          if isinstance(briefings, list):
              print(
                  f"\n法人說明會資料筆數：{len(briefings)}"
              )
          else:
              print("\n找不到 briefings 陣列")
          PY
      # ============================================================
      # 6. 上傳測試結果
      # ============================================================
      - name: Upload test result
        uses: actions/upload-artifact@v4
        with:
          name: mops-briefing-test-result
          path: mops_briefing_2330_2025.json
