name: Run Stock Analysis

on:
  schedule:
    # 每天台灣時間晚上 9 點自動執行 (UTC 13:00)
    - cron: '0 12 * * *'
  workflow_dispatch: # 允許你隨時手動點擊按鈕執行

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允許 Actions 把生成的網頁推回倉庫

    steps:
    - name: 檢查程式碼
      uses: actions/checkout@v3

    - name: 設定 Python 環境
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 安裝必要套件
      run: |
        python -m pip install --upgrade pip
        pip install FinMind pandas requests

    - name: 執行選股分析
      run: python main.py

    - name: 將生成的網頁發布回 GitHub
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add index.html
        git diff-index --quiet HEAD || git commit -m "更新股票追蹤資料 [skip ci]"
        git push
