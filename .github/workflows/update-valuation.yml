name: Update Stock Valuation CSV

on:
  schedule:
    # GitHub Actions 使用 UTC；08:00 UTC = 台灣時間 16:00
    - cron: "0 8 * * 1-5"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-stock-valuation
  cancel-in-progress: false

jobs:
  update-valuation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Update valuation CSV
        run: |
          python valuation.py

      - name: Verify valuation CSV
        shell: bash
        run: |
          set -e

          if [ ! -s twse_valuation_latest.csv ]; then
            echo "錯誤：最新估值 CSV 不存在或為空"
            exit 1
          fi

          python - <<'PY'
          import pandas as pd
          from pathlib import Path

          path = Path("twse_valuation_latest.csv")
          df = pd.read_csv(
              path,
              dtype={"stock_id": str},
              encoding="utf-8-sig"
          )

          required = {
              "valuation_date",
              "stock_id",
              "stock_name",
              "close_price",
              "pe_ratio",
              "pb_ratio",
              "dividend_yield",
              "dividend_year",
              "financial_period",
          }

          missing = required - set(df.columns)

          if missing:
              raise SystemExit(
                  f"CSV 缺少必要欄位：{sorted(missing)}"
              )

          if df.empty:
              raise SystemExit("CSV 沒有股票資料")

          if df["stock_id"].isna().any():
              raise SystemExit("CSV 存在空白股票代號")

          dates = df["valuation_date"].dropna().unique()

          if len(dates) != 1:
              raise SystemExit(
                  f"估值日期不一致：{dates.tolist()}"
              )

          print(f"估值日期：{dates[0]}")
          print(f"股票筆數：{len(df)}")
          print("CSV 驗證成功")
          PY

      - name: Commit valuation CSV files
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- twse_valuation_latest.csv
          git add -- 'twse_valuation_*.csv'

          if git diff --cached --quiet; then
            echo "估值 CSV 沒有變更，不需要提交"
            exit 0
          fi

          git commit -m "Update stock valuation CSV [skip ci]"
          git push origin HEAD:main
