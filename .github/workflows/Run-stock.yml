name: Run Stock Analysis

on:
  schedule:
    # 每天台灣時間晚上 9 點7分（UTC 13:00）
    - cron: '7 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ========================================================
      # 1. 取得程式碼
      # ========================================================
      - name: 檢查程式碼
        uses: actions/checkout@v4

      # ========================================================
      # 2. 設定 Python
      # ========================================================
      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      # ========================================================
      # 3. 安裝套件
      # ========================================================
      - name: 安裝必要套件
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # ========================================================
      # 4. 更新股票名稱資料
      # ========================================================
      - name: 更新股票名稱資料
        id: update_stocks
        continue-on-error: true
        run: python update_stocks.py

      # ========================================================
      # 5. 驗證股票名稱資料
      # ========================================================
      - name: 驗證股票名稱資料
        id: validate_stocks
        if: always()
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path("stocks.json")

          if not path.exists():
              print("錯誤：stocks.json 不存在")
              sys.exit(1)

          try:
              with path.open("r", encoding="utf-8") as f:
                  data = json.load(f)

              if not isinstance(data, dict):
                  raise ValueError("根節點不是 JSON 物件")

              stocks = data.get("stocks")

              if not isinstance(stocks, list):
                  raise ValueError("缺少 stocks 陣列")

              if len(stocks) < 800:
                  raise ValueError(
                      f"股票資料數量不足：{len(stocks)}"
                  )

              valid = set()

              for stock in stocks:
                  if not isinstance(stock, dict):
                      continue

                  code = str(stock.get("stock_id", "")).strip()

                  if code.endswith(".0"):
                      code = code[:-2]

                  if (
                      code.isdigit()
                      and (
                          stock.get("short_name")
                          or stock.get("company_name")
                      )
                  ):
                      valid.add(code)

              if len(valid) < 800:
                  raise ValueError(
                      f"有效股票代碼不足：{len(valid)}"
                  )

              if data.get("stock_count") != len(stocks):
                  raise ValueError(
                      "stock_count 與 stocks 陣列數量不一致"
                  )

              print("stocks.json 驗證通過")
              print("更新時間：", data.get("update_time"))
              print("股票總數：", len(stocks))
              print("有效股票代碼數：", len(valid))

          except Exception as e:
              print(f"stocks.json 驗證失敗：{e}")
              sys.exit(1)
          PY

      # ========================================================
      # 6. 更新失敗時，確認舊資料是否可用
      # ========================================================
      - name: 判斷是否可以繼續分析
        if: always()
        env:
          UPDATE_OUTCOME: ${{ steps.update_stocks.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate_stocks.outcome }}
        run: |
          echo "股票名稱更新結果：$UPDATE_OUTCOME"
          echo "股票資料驗證結果：$VALIDATE_OUTCOME"

          if [ "$VALIDATE_OUTCOME" != "success" ]; then
            echo "::error::沒有可用的 stocks.json，停止分析。"
            exit 1
          fi

          if [ "$UPDATE_OUTCOME" != "success" ]; then
            echo "::warning::股票名稱更新失敗，將使用既有有效資料繼續分析。"
          fi

      # ========================================================
      # 7. 執行分析
      # ========================================================
      - name: 執行選股分析
        run: python main.py

      # ========================================================
      # 8. 驗證分析結果
      # ========================================================
      - name: 檢查分析結果
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          for filename in ["stocks.json", "analysis.json"]:
              path = Path(filename)

              if not path.exists():
                  raise FileNotFoundError(
                      f"找不到輸出檔案：{filename}"
                  )

              with path.open("r", encoding="utf-8") as f:
                  data = json.load(f)

              if not isinstance(data, dict):
                  raise ValueError(
                      f"{filename} 根節點必須是 JSON 物件"
                  )

              print(f"{filename}：JSON 格式正常")

          with open("analysis.json", "r", encoding="utf-8") as f:
              analysis = json.load(f)

          stocks = analysis.get("stocks")

          if not isinstance(stocks, list):
              raise ValueError(
                  "analysis.json 缺少有效的 stocks 陣列"
              )

          if analysis.get("stock_count") != len(stocks):
              raise ValueError(
                  "analysis.json 的 stock_count 與 stocks 數量不一致"
              )

          for item in stocks:
              if not isinstance(item, dict):
                  raise ValueError(
                      "analysis.json 包含非物件格式的股票資料"
                  )

              score = item.get("score")

              if score is not None:
                  if isinstance(score, bool):
                      raise ValueError("綜合分數不可為布林值")

                  if not isinstance(score, (int, float)):
                      raise ValueError("綜合分數不是數值")

                  if not math.isfinite(score) or not 0 <= score <= 100:
                      raise ValueError(
                          f"綜合分數超出範圍：{item.get('stock_id')}"
                      )

          print("分析更新時間：", analysis.get("update_time"))
          print("分析股票數量：", analysis.get("stock_count"))
          print("總分可用數量：", analysis.get("score_complete_count"))
          print("資料完整數量：", analysis.get("data_complete_count"))
          PY

      # ========================================================
      # 9. 提交更新資料
      # ========================================================
      - name: 保存股票分析資料
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add analysis.json stocks.json

          if [ -f stock_analysis.log ]; then
            git add -f stock_analysis.log
          fi

          if ! git diff --cached --quiet; then
            git commit -m "更新股票分析資料 [skip ci]"
            git push
          else
            echo "資料沒有變更，不需要提交"
          fi
