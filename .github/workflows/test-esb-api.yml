name: Test ESB Stock Price API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-esb-api:
    runs-on: ubuntu-latest

    steps:
      # 1. 下載 GitHub 專案
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 設定 Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # 3. 安裝必要套件
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # 4. 執行興櫃 API 測試
      - name: Run ESB API test
        run: |
          python test_esb_api.py

      # 5. 保存測試結果
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esb-6750-api-test
          path: |
            esb_6750_api_raw.txt
            esb_6750_api_result.json
          if-no-files-found: warn
          retention-days: 7
