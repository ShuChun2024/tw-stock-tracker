name: Test Breakout Strategy

on:
  push:
    branches:
      - main
    paths:
      - "breakout.py"
      - "main.py"
      - "test_breakout*.py"
      - ".github/workflows/test_breakout.yml"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Breakout Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 1. 取得 GitHub 專案程式碼
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 設定 Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # 3. 確認 Python 語法
      - name: Check Python syntax
        run: |
          python -m py_compile breakout.py main.py

      # 4. 執行布林策略相關單元測試
      - name: Run Breakout Unit Tests
        run: |
          python -m unittest discover -v -p "test_breakout*.py"

      # 5. 顯示測試完成
      - name: Test Summary
        if: success()
        run: |
          echo "Breakout strategy tests passed."
