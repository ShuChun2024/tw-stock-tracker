name: Test Breakout Strategy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # ========================================================
      # 1. 取得程式碼
      # ========================================================
      - name: 取得專案程式碼
        uses: actions/checkout@v4

      # ========================================================
      # 2. 設定 Python
      # ========================================================
      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      # ========================================================
      # 3. 安裝套件
      # ========================================================
      - name: 安裝必要套件
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # ========================================================
      # 4. 檢查測試檔案
      # ========================================================
      - name: 檢查測試檔案
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys

          required_files = [
              "breakout.py",
              "test_breakout.py"
          ]

          missing = [
              name
              for name in required_files
              if not Path(name).is_file()
          ]

          if missing:
              print("缺少必要檔案：", missing)
              sys.exit(1)

          print("必要測試檔案檢查通過")
          PY

      # ========================================================
      # 5. 執行第一階段測試
      # ========================================================
      - name: 執行 breakout.py 第一階段測試
        run: |
          python -m unittest -v test_breakout

      # ========================================================
      # 6. 測試結果
      # ========================================================
      - name: 顯示測試完成訊息
        if: success()
        run: |
          echo "======================================"
          echo "breakout.py 第一階段測試全部通過"
          echo "======================================"

      - name: 顯示測試失敗訊息
        if: failure()
        run: |
          echo "======================================"
          echo "breakout.py 第一階段測試失敗"
          echo "請檢查前面的錯誤紀錄"
          echo "======================================"
