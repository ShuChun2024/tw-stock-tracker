name: 更新股票事件消息old

on:
  workflow_dispatch:

  schedule:
    # 台灣時間每天 10:00 執行
    # GitHub Actions 使用 UTC，所以台灣 10:00 = UTC 02:00
    - cron: "0 2 * * *"

permissions:
  contents: write

jobs:
  collect-events:
    runs-on: ubuntu-latest

    steps:
      # =====================================================
      # 1. 取得 GitHub Repository 程式碼
      # =====================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =====================================================
      # 2. 設定 Python
      # =====================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # =====================================================
      # 3. 安裝 Python 套件
      # =====================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas lxml beautifulsoup4 python-docx pdfplumber

      # =====================================================
      # 4. 執行法人說明會資料收集與解析
      # =====================================================
      - name: Run conference collector
        run: |
          python test_conference.py

      # =====================================================
      # 5. 檢查法人說明會結果是否產生
      # =====================================================
      - name: Check conference result
        run: |
          if [ ! -f twse_conference_v13_result.json ]; then
            echo "錯誤：twse_conference_v13_result.json 沒有產生"
            exit 1
          fi

          echo "twse_conference_v13_result.json 已產生"
          ls -lh twse_conference_v13_result.json

      # =====================================================
      # 6. 執行事件資料收集程式
      # =====================================================
      - name: Run event collector
        run: |
          python event_collector.py

      # =====================================================
      # 7. 檢查 events.json 是否產生
      # =====================================================
      - name: Check events.json
        run: |
          if [ ! -f events.json ]; then
            echo "錯誤：events.json 沒有產生"
            exit 1
          fi

          echo "events.json 已產生"
          ls -lh events.json

      # =====================================================
      # 8. 將 events.json 寫回 GitHub
      # =====================================================
      - name: Commit events.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add events.json

          if git diff --cached --quiet; then
            echo "events.json 沒有新的變更，不需要提交"
          else
            git commit -m "更新股票事件消息"
            git push
          fi
