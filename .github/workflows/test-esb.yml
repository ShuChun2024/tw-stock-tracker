name: Test Emerging Stock Market API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-esb:
    runs-on: ubuntu-latest

    steps:
      # =====================================================
      # 1. 取得 GitHub Repository
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # =====================================================
      # 2. 設定 Python
      # =====================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # =====================================================
      # 3. 安裝套件
      # =====================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # =====================================================
      # 4. 執行興櫃行情網頁診斷
      # =====================================================

      - name: Run ESB API Diagnostic
        run: |
          python test_esb.py

      # =====================================================
      # 5. 檢查輸出檔案
      # =====================================================

      - name: Check diagnostic output
        if: always()
        run: |
          echo "========================================"
          echo "檢查興櫃行情診斷結果"
          echo "========================================"

          if [ -f esb_6750_response.txt ]; then
            echo "找到原始 HTML"
            ls -lh esb_6750_response.txt
          else
            echo "找不到原始 HTML"
          fi

          if [ -f esb_6750_api_diagnostic.txt ]; then
            echo "找到 API 診斷報告"
            ls -lh esb_6750_api_diagnostic.txt
          else
            echo "找不到 API 診斷報告"
          fi

      # =====================================================
      # 6. 上傳診斷檔案
      # =====================================================

      - name: Upload ESB diagnostic result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esb-6750-api-diagnostic
          path: |
            esb_6750_response.txt
            esb_6750_api_diagnostic.txt
          if-no-files-found: warn
          retention-days: 7
