name: Run Stock Price API

on:
  schedule:
    - cron: "0 10 * * 1-5" # 台灣時間平日 18:00
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stock-price
  cancel-in-progress: false

jobs:
  run-stock-price:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run stock price API
        run: python stock_price.py

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-price-result
          path: stock_prices.json
          if-no-files-found: ignore
          retention-days: 7
